# Open Boolean Benchmark runner for ExactMeshBoolean (geometry3Sharp). To use it, copy this folder into
# https://github.com/Open-Boolean-Benchmark/boolean-benchmark-runners as exactmeshboolean/<version>/ and set
# upstream.ref to a fixed commit.
runner:
  family: exactmeshboolean
  version: "master"
  algorithm: boolean
  runner_id: exactmeshboolean-master-boolean
  display_name: "ExactMeshBoolean (geometry3Sharp)"

upstream:
  source: git
  url: https://github.com/HarmenGrosseDeters/geometry3sharp.git
  ref: master
  # resolved_commit is filled in by build.py at build time and recorded in bin/build-info.json

build:
  script: ./build.py
  outputs:
    - bin/exactmeshboolean_runner
    - bin/build-info.json
  default_mode: release

entry:
  kind: executable
  command: ./bin/exactmeshboolean_runner
  args:
    - --request
    - "{request}"
    - --result
    - "{result}"

variants:
  - id: base
    internal: true
    args: []
    capabilities:
      operations: [union, intersection, difference]
      input_formats: [off, obj, stl]
      requires_closed_meshes: false
      accepts_self_intersections: true
      accepts_non_manifold_inputs: true
      supports_components: true
      supports_variadic_booleans: false

  - id: default
    extends: base
    label: "Default"
    display_name: "ExactMeshBoolean"
    color: "#2E7D32"
    args: []

notes:
  - "Mesh type: g3.DMesh3; boolean: g3.ExactMeshBoolean (exact arrangement and winding numbers, output rounded to double)"
  - "Solid = positive winding number: self-intersecting, nested and non-manifold closed inputs are handled; open inputs use the generalized winding number (result in general not closed)"
  - "Requires the .NET 10 SDK to build and the .NET 10 runtime to run; multi-threaded (all cores)"
  - "One argument: self-operation (union/intersection = the resolved solid, difference = empty); 3+ arguments: unsupported"
  - "Raw mesh format: DMesh3"
  - "io_ms (load-mesh): file -> DMesh3 (g3.StandardMeshReader builds the native mesh directly; import_ms = 0)"
  - "operation_ms (boolean ops): ExactMeshBoolean.Compute(), after a JIT warm-up on a small problem at start-up"
  - "export_ms (boolean ops): 0, the result is a DMesh3; the OBJ write is only in debug_total_ms"
