name: Mutation tests

# Stryker.NET (Apache-2.0), tests/mutation, docs/QA.md 2.2: too slow for every PR, so in full on master (nightly / weekly) and on
# demand, and on ready PRs (not drafts) only incrementally for the configs that the PR touches
# (tests/mutation/select_shards.py). Exact Boolean 3.0 process (owner 2026-11-11): no full shard run on a PR (a full shard
# is a 3-6 h runner slot): a shard without a fitting baseline (config or tools changed, split offsets moved, no baseline
# in the cache) runs nothing on the PR and says "full run on master" in its summary; the nightly run seeds the baselines.
# Two jobs:
# - exact-arithmetic: math/ExactPredicates.cs, ExactPoint3.cs, AdaptivePredicates.cs (about 50 minutes);
# - exact-mesh: the exact mesh pipeline (mesh_ops/ExactMesh*.cs, ExactPlanarSimplify.cs, ExactTriangulation2.cs,
#   MeshRoundingRepair.cs, math/FixedPoint3.cs, the arrangement's fixed-width points, and math/Generated/*.cs, the
#   generated predicates, and mesh_ops/PolyhedralEnvelope.cs, the envelope), in shards that run in
#   parallel (tests/mutation/stryker-mesh-*.json).
# A shard whose mutated file changed runs incrementally (tests/mutation/incremental.py): Stryker mutates only the changed
# lines, the other mutants keep their results from the last full run (the baseline, kept in the Actions cache), and the
# shard fails when the combined score drops below the break threshold of its config; without a cached baseline it runs
# in full. A shard whose config
# or tools changed runs in full. A shard of which only tests changed runs with --since and only reports. Every full run
# stores its report as the baseline. The reports list the surviving mutants.

on:
  pull_request:
    # (converted_to_draft: the concurrency group below cancels a run that is under way)
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'math/ExactPredicates.cs'
      - 'math/ExactPoint3.cs'
      - 'math/AdaptivePredicates.cs'
      - 'math/FixedPoint3.cs'
      - 'math/Generated/*.cs'
      - 'mesh_ops/ExactMesh*.cs'
      - 'mesh_ops/ExactPlanarSimplify.cs'
      - 'mesh_ops/ExactTriangulation2.cs'
      - 'mesh_ops/MeshRoundingRepair.cs'
      - 'mesh_ops/PolyhedralEnvelope.cs'
      - 'math/ExactIntervals.cs'
      - 'math/ExactSlopePredicates.cs'
      - 'math/ExactSlopeKernel.cs'
      - 'mesh_ops/TerrainSlope*.cs'
      - 'tests/geometry3Sharp.Tests/ExactPredicatesTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactImplicitPointTests.cs'
      - 'tests/geometry3Sharp.Tests/PredicateDifferentialTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPoint3ConversionTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPoint3FixedWidthTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactOrient3dKernelTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactTouchOnlyCoplanarTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPlanesFixedWidthTests.cs'
      - 'tests/geometry3Sharp.Tests/GeneratedPredicatesIndirectTests.cs'
      - 'tests/geometry3Sharp.Tests/PolyhedralEnvelopeTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactMeshBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactFilterBoundTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactArrangementScalingTests.cs'
      - 'tests/geometry3Sharp.Tests/BoxTreeMortonTests.cs'
      - 'tests/geometry3Sharp.Tests/BoxTreeOrderTests.cs'
      - 'tests/geometry3Sharp.Tests/TriTriPrefilterTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPlanarSimplifyTests.cs'
      - 'tests/geometry3Sharp.Tests/MeshRoundingRepair*Tests.cs'
      - 'tests/geometry3Sharp.Tests/RoundingDriftApexTests.cs'
      - 'tests/geometry3Sharp.Tests/SafeRoundingBoundTests.cs'
      - 'tests/geometry3Sharp.Tests/RoundingExactPairsTests.cs'
      - 'tests/geometry3Sharp.Tests/RoundingDirtyTreeTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactBooleanPropertyFindings.cs'
      - 'tests/geometry3Sharp.Tests/ExactTriangulation2Tests.cs'
      - 'tests/geometry3Sharp.Tests/BooleanPerformanceTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactIntervalsTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactSlopeKernelTests.cs'
      - 'tests/geometry3Sharp.Tests/TerrainSlope*Tests.cs'
      - 'tests/mutation/*'
      - 'tests/mutation/local-results/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation.yml'
  schedule:
    # master, in the evening (UTC): the big shards of the exact boolean pipeline (boolean-*, arrangement-*, rounding-*, 18 of
    # the 26 configs) Monday to Saturday, everything else (envelope, terrain, planar, fixed, generated, arithmetic) on Sunday
    # (tests/mutation/select_shards.py --only nightly / weekly). Estimate: a shard takes 3 to 6 hours (README), 12 run at a
    # time, so the 18 big shards need two waves, about 10 to 12 hours: started at 19:17 UTC they end by about 07:00 UTC at
    # the latest, mostly before the CI of the Berlin working day starts (about 05:30 UTC); a night at 01:17 would end at noon.
    # The baselines of the incremental PR runs come from these runs.
    - cron: '17 19 * * 1-6'     # Monday to Saturday 19:17 UTC: nightly group
    - cron: '17 19 * * 0'       # Sunday 19:17 UTC: weekly group
  workflow_dispatch:
    inputs:
      shards:
        description: 'Shards to run in full: all, or a comma-separated list (arithmetic, rounding-1, boolean-1, ...)'
        default: all

# a new push to the same PR cancels the running run. The runs on master never cancel: the scheduled runs and the
# workflow_dispatch runs have a group each (GitHub keeps one running and ONE pending run per group, a third run replaces the
# pending one), so a nightly run cannot drop a pending dispatch (a gate run) and the reverse; two dispatches in a row do
# replace a pending one (the later request wins), and a scheduled run queues behind an earlier one that is still running.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # which configs a PR needs, and how (schedule and workflow_dispatch run all of them in full). Runs on drafts too, so
  # that the selection can be seen there; the jobs below wait for "ready for review".
  changes:
    runs-on: ubuntu-latest
    outputs:
      arithmetic: ${{ steps.select.outputs.arithmetic }}
      mesh: ${{ steps.select.outputs.mesh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the selection and the baseline tooling
        working-directory: tests/mutation
        run: |
          python3 test_select_shards.py
          python3 test_baseline.py
          python3 test_incremental.py
          python3 test_suggest_split.py
          python3 test_run_stryker.py
          python3 test_local_result.py
          python3 test_run_local.py
          python3 test_resplit.py
      - name: Check the local results of this PR
        # (3.0 process, tests/mutation/README.md "Local runs": a full run of a shard by the owner, committed under
        # tests/mutation/local-results/<sha>/; valid for the commit being gated, counts as the shard passing for the
        # completion gate. Only the files this PR adds: results of earlier PRs stay in the tree for their own commits)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- tests/mutation/local-results)"
          if [ -z "$files" ]; then echo "no local results in this PR"; exit 0; fi
          python3 tests/mutation/local_result.py check --root . --head "$HEAD" --summary "$GITHUB_STEP_SUMMARY" $files
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          SHARDS: ${{ github.event.inputs.shards }}
          SCHEDULE: ${{ github.event.schedule }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # a failed git diff must fail this step: empty input would select nothing and skip the runs in green
          set -o pipefail
          if [ "$EVENT" != "pull_request" ]; then
            if [ "$EVENT" = schedule ]; then
              # (Sunday: the weekly group, else the nightly one; the cron strings are in the trigger above)
              if [ "$SCHEDULE" = "17 19 * * 0" ]; then SHARDS=weekly; else SHARDS=nightly; fi
            fi
            python3 tests/mutation/select_shards.py --all --only "${SHARDS:-all}" | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE...$HEAD" | python3 tests/mutation/select_shards.py | tee -a "$GITHUB_OUTPUT"
          fi

  exact-arithmetic:
    needs: changes
    if: needs.changes.outputs.arithmetic != 'none' && needs.changes.outputs.arithmetic != '' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: needs.changes.outputs.arithmetic == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-
      - name: Stryker
        working-directory: tests/mutation
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_FULL: ${{ github.event_name == 'pull_request' && '1' || '' }}
          G3_LIMIT_SECONDS: '9000'                # the job's timeout-minutes (150) in seconds, for the early stop
        run: bash run_stryker.sh stryker-config.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (needs.changes.outputs.arithmetic == 'tests' || needs.changes.outputs.arithmetic == 'source' || github.event_name == 'pull_request') && 'warn' || 'error' }}
      - name: Upload the Stryker logs
        # (so that a shard cancelled at the job's limit still shows what ran: the test runs and Stryker's own log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-logs
          path: tests/mutation/StrykerOutput/*/logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && github.event_name != 'pull_request' && (needs.changes.outputs.arithmetic == 'full' || needs.changes.outputs.arithmetic == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}

  exact-mesh:
    needs: changes
    if: startsWith(needs.changes.outputs.mesh, '[{') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # at most 12 shards at a time (was 4: the 15 mesh shards of a full run then took 4 waves, about 12 hours of wall
      # time, with the longest shards queued behind others). The account runs at most 20 jobs at once; a full run is
      # 12 mesh shards + the arithmetic job + the selection job = 14, which leaves 6 for the CI of the PRs. Scheduling
      # only: it changes no shard's result (select_shards.py: not a reason for full runs)
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mesh) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: matrix.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-
      - name: Stryker
        working-directory: tests/mutation
        # a mutant can turn a loop into one that allocates without end: a heap limit per process makes that an
        # OutOfMemoryException in the test host (the mutant is killed) instead of a runner that runs out of memory
        env:
          DOTNET_GCHeapHardLimit: '0x180000000'   # 6 GB
          MODE: ${{ matrix.mode }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_FULL: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: bash run_stryker.sh stryker-mesh-${{ matrix.shard }}.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Surviving mutants
        if: always()
        run: >
          jq -r '.files | to_entries[] | .key as $f | .value.mutants[]
          | select(.status == "Survived" or .status == "NoCoverage")
          | "\(.status) \($f | split("/") | last):\(.location.start.line) \(.mutatorName): \(.replacement // "" | gsub("\n"; " ") | .[0:160])"'
          tests/mutation/StrykerOutput/*/reports/mutation-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (matrix.mode == 'tests' || matrix.mode == 'source' || github.event_name == 'pull_request') && 'warn' || 'error' }}
      - name: Upload the Stryker logs
        # (so that a shard cancelled at the job's limit still shows what ran: the test runs and Stryker's own log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-logs-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && github.event_name != 'pull_request' && (matrix.mode == 'full' || matrix.mode == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ matrix.mode }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
