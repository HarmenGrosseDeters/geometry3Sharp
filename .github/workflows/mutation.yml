name: Mutation tests

# Stryker.NET (Apache-2.0), tests/mutation, docs/QA.md 2.2 (docs/qa/mutation-and-coverage.md): too slow for every PR, so the
# shards run in full on master (scheduled nightly / weekly groups, and workflow_dispatch), and a ready PR (not a draft) runs only
# what gates its merge (owner 2026-11-23, runner load; tests/mutation/select_shards.py --pr). Two jobs:
# - exact-arithmetic: math/ExactPoint3.cs, ExactDoubleWord.cs and the exact route of IntrTriangle3Triangle3.cs (about 20 minutes; the
#   predicates ExactPredicates.cs (two parts) and AdaptivePredicates.cs are the shards predicates-1, predicates-2 and adaptive of the exact-mesh job, since 23 November 2026);
# - exact-mesh: the exact mesh pipeline (mesh_ops/ExactMesh*.cs, ExactPlanarSimplify.cs, ExactTriangulation2.cs,
#   MeshRoundingRepair.cs, math/FixedPoint3.cs, the arrangement's fixed-width points, and math/Generated/*.cs, the
#   generated predicates, and mesh_ops/PolyhedralEnvelope.cs, the envelope), in shards that run in
#   parallel (tests/mutation/stryker-mesh-*.json). The UV parameterization (parameterization/*.cs) has seven shards of
#   its own (stryker-mesh-uv-*.json, tests/mutation/README.md "UV parameterization"); they are not exact code.
# On a pull request a shard runs only incrementally (tests/mutation/incremental.py: Stryker mutates only the changed lines, the
# other mutants keep their results from the last full run on master, the baseline in the Actions cache, and the shard fails when
# the combined score drops below the break threshold of its config), and only if the PR changes an exact-code file that the
# shard mutates (the exact section of .editorconfig), or if the PR has the label `mutation` (set by the coordinator for a PR that
# adds or changes an error bound outside the exact files; read live, so a re-run after setting it sees it). A PR never makes a
# full run (NO_FULL=1 in run_stryker.sh: a shard without a cached baseline writes "full run on master" and succeeds), nor a run
# of changed tests only, nor a run of non-exact code without the label: those shards are listed as NOT RUN with the reason, and
# master runs them (a PR that needs a full shard run as its gate gets it dispatched on master after the merge, CLAUDE.md).
# On master (schedule, dispatch) every selected shard runs in full and stores its report as the baseline. The reports list the
# surviving mutants.

on:
  pull_request:
    # (converted_to_draft and closed: the concurrency group below cancels a run that is under way; on closed, which
    # includes a merge, the selection job is skipped, so nothing new runs and no runner stays busy for a finished PR)
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    # (owner 2026-11-23: only the mutated sources, the configs and the tooling. A PR runs only incremental runs of the shards of a
    # changed exact-code file, or of every changed mutated file under the label `mutation` (select_shards.py --pr); a change of
    # tests only makes no PR run, so the test files are not trigger paths)
    paths:
      - 'math/ExactPredicates.cs'
      - 'math/ExactPoint3.cs'
      - 'math/AdaptivePredicates.cs'
      - 'intersection/IntrExactBox3.cs'
      - 'math/ExactRayTriangle.cs'
      - 'math/ExactDoubleWord.cs'
      - 'intersection/IntrTriangle3Triangle3.cs'
      - 'math/FixedPoint3.cs'
      - 'math/ExactLimbSigns.cs'
      - 'math/ExactLimbPrepared.cs'
      - 'math/Generated/*.cs'
      - 'mesh_ops/ExactMesh*.cs'
      - 'mesh_ops/ExactPlanarSimplify.cs'
      - 'mesh_ops/ExactTriangulation2.cs'
      - 'mesh_ops/MeshRoundingRepair.cs'
      - 'mesh_ops/PolyhedralEnvelope.cs'
      - 'math/ExactIntervals.cs'
      - 'math/ExactSlopePredicates.cs'
      - 'math/ExactSlopeKernel.cs'
      - 'mesh_ops/TerrainSlope*.cs'
      - 'mesh_ops/MeshHausdorffDistance.cs'
      - 'queries/TriangleDeviationBounds.cs'
      - 'queries/CertifiedTriangleBounds.cs'
      - 'queries/CertifiedDet3.cs'
      - 'queries/CertifiedPointMeshDistance.cs'
      # exact winding number (tests/mutation/stryker-mesh-exact-winding.json)
      - 'spatial/ExactWindingCache.cs'
      # SolidBooleanPipeline (tests/mutation/stryker-mesh-solid-pipeline.json)
      - 'mesh_ops/SolidBooleanPipeline.cs'
      # UV parameterization (tests/mutation/stryker-mesh-uv-*.json: seven shards of parameterization/*.cs, README "UV parameterization")
      - 'parameterization/UVAtlasGenerator.cs'
      - 'parameterization/MeshChartSegmentation.cs'
      - 'parameterization/MeshDiscCut.cs'
      - 'parameterization/UVPacker.cs'
      - 'parameterization/UVOverlap.cs'
      - 'parameterization/ConeFlattening.cs'
      - 'parameterization/BoundaryFirstFlattening.cs'
      - 'parameterization/SLIMParameterization.cs'
      - 'parameterization/ARAPParameterization.cs'
      - 'parameterization/FoldoverFreeParameterization.cs'
      - 'parameterization/LSCMParameterization.cs'
      - 'parameterization/SpectralConformalParameterization.cs'
      - 'parameterization/MeshParameterization.cs'
      # the exact code of .editorconfig (select_shards.exact_globs; the files without a shard get the notice of `hint`)
      - 'comp_geom/SnapRounding2.cs'
      - 'math/Exact*.cs'
      - 'intersection/ExactTriangleIntersection.cs'
      - 'intersection/TriangleTriangleFilter.cs'
      - 'intersection/ContinuousCollision.cs'
      - 'mesh_ops/ContouringTopologyCertificate.cs'
      - 'tests/mutation/*'
      - 'tests/mutation/local-results/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation.yml'
  schedule:
    # master, in the evening (UTC; Exact Boolean 3.0, tests/mutation/README.md "3.0 process"): the big shards of the exact boolean
    # pipeline (boolean-*, arrangement-*, rounding-*: 28 of the 58 configs) Monday to Saturday, everything else (envelope, imprint,
    # geodesic, hausdorff, terrain, planar, fixed, generated, solid-pipeline, exact-winding, arithmetic) on Sunday (select_shards.py --only nightly / weekly).
    # Estimate, not measured: a shard takes 1 to 6 hours (README) and 6 run at a time (max-parallel), so the 28 nightly shards need
    # about 12 to 16 hours, ending between 07:00 and 11:00 UTC. The baselines of the incremental PR runs come from these runs.
    # These cron lines are the fallback of the daily dispatch (docs/QA.md 2.12): the schedule guard skips them on a day that a
    # plain dispatch (`shards=all`) already ran.
    - cron: '17 19 * * 1-6'     # Monday to Saturday 19:17 UTC: nightly group
    - cron: '17 19 * * 0'       # Sunday 19:17 UTC: weekly group
  workflow_dispatch:
    inputs:
      shards:
        description: 'Shards to run in full: all, or a comma-separated list of shards, prefixes (boolean-*) and the groups nightly and weekly (arithmetic, rounding-1, boolean-1, ...)'
        default: all
      force:
        description: 'Run although a daily run of today already ran or is running (the schedule guard)'
        type: boolean
        default: false

# a new push to the same PR, a switch back to draft, and closing or merging the PR cancel the running run; a scheduled or
# dispatched run is never cancelled by another (hours of work). The runs on master have a group per kind of run: GitHub keeps one
# running and ONE pending run per group and cancels an older pending run when another arrives, so a scheduled run cannot drop a
# pending dispatch (a gate run) and the reverse; two dispatches in a row do replace a pending one (the later request wins), and a
# scheduled run queues behind an earlier scheduled one that is still running. A scheduled run that starts while a dispatched
# full run of the day is under way is skipped by the schedule guard (docs/QA.md 2.12), not queued.
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && github.ref || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # which configs a PR needs, and how (schedule and workflow_dispatch run all of them in full). Runs on drafts too, so
  # that the selection can be seen there; the jobs below wait for "ready for review".
  changes:
    # a closed (or merged) PR only cancels its running run through the concurrency group; the jobs below need this one,
    # so they are skipped too
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read          # the schedule guard reads the earlier runs of today
      pull-requests: read    # the labels of the PR, read live (a re-run after the label `mutation` was set sees it)
    outputs:
      arithmetic: ${{ steps.select.outputs.arithmetic }}
      mesh: ${{ steps.select.outputs.mesh }}
      skipped: ${{ steps.select.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the selection and the baseline tooling
        working-directory: tests/mutation
        run: |
          python3 test_select_shards.py
          python3 test_baseline.py
          python3 test_incremental.py
          python3 test_suggest_split.py
          python3 test_narrow_tests.py
          python3 test_exclude_other_sources.py
          python3 test_run_stryker_restore.py
          python3 test_run_stryker.py
          python3 test_local_result.py
          python3 test_run_local.py
          python3 test_resplit.py
      - name: Check the local results of this PR
        # (3.0 process, tests/mutation/README.md "Local runs": a full run of a shard by the owner, committed under
        # tests/mutation/local-results/<sha>/; valid for the commit being gated, counts as the shard passing for the
        # completion gate. Only the files this PR adds: results of earlier PRs stay in the tree for their own commits)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" -- tests/mutation/local-results)"
          if [ -z "$files" ]; then echo "no local results in this PR"; exit 0; fi
          python3 tests/mutation/local_result.py check --root . --head "$HEAD" --summary "$GITHUB_STEP_SUMMARY" $files
      # Runs once a day although two things start it (docs/QA.md 2.12): the external dispatcher at a fixed time and the cron
      # line as the fallback (tools/schedule_guard.py). A step of this job, not a job of its own: select_shards.py takes a new
      # job or top key of this workflow as a reason to run every shard in full.
      - if: github.event_name != 'pull_request'
        name: Schedule guard${{ github.event_name == 'workflow_dispatch' && inputs.shards != 'all' && inputs.shards != '' && ' [custom]' || '' }}
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          FORCE: ${{ inputs.force }}
          CUSTOM: ${{ github.event_name == 'workflow_dispatch' && inputs.shards != 'all' && inputs.shards != '' }}
        run: python3 tools/schedule_guard.py --workflow mutation.yml --event "$EVENT" --run-id "$RUN_ID" --branch "$BRANCH" --default-branch "$DEFAULT_BRANCH" --custom "$CUSTOM" --force "$FORCE"
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          GUARD: ${{ steps.guard.outputs.run }}
          SHARDS: ${{ github.event.inputs.shards }}
          SCHEDULE: ${{ github.event.schedule }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # a failed git diff must fail this step: empty input would select nothing and skip the runs in green
          set -o pipefail
          if [ "$GUARD" = false ]; then
            # skipped by the schedule guard: nothing to run (the Stryker jobs wait for a non-empty selection)
            echo 'arithmetic=none' | tee -a "$GITHUB_OUTPUT"
            echo 'mesh=[]' | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "pull_request" ]; then
            if [ "$EVENT" = schedule ]; then
              # (Sunday: the weekly group, else the nightly one; the cron strings are in the trigger above)
              if [ "$SCHEDULE" = "17 19 * * 0" ]; then SHARDS=weekly; else SHARDS=nightly; fi
            fi
            python3 tests/mutation/select_shards.py --all --only "${SHARDS:-all}" | tee -a "$GITHUB_OUTPUT"
          else
            # (the labels are read live, not from the event payload: the label `mutation` is set by the coordinator, and a re-run of
            # this run after that must see it; the PR has no `labeled` trigger, so another label cannot cancel a run under way)
            labels="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name' | paste -sd, -)"
            echo "labels: $labels"
            git diff --name-only "$BASE...$HEAD" > changed.txt
            python3 tests/mutation/select_shards.py --pr --labels "$labels" < changed.txt | tee -a "$GITHUB_OUTPUT"
            python3 tests/mutation/select_shards.py hint < changed.txt
            python3 tests/mutation/select_shards.py hint --summary < changed.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Shards not run on this PR
        # (select_shards.py --pr: a shard that is not an incremental run of a changed exact-code file (or of a changed file under the
        # label `mutation`) is not started, so it shows as skipped, with the notice and the summary here; master runs it)
        if: github.event_name == 'pull_request' && steps.select.outputs.skipped != '' && steps.select.outputs.skipped != '[]'
        env:
          SKIPPED: ${{ steps.select.outputs.skipped }}
        run: |
          python3 tests/mutation/select_shards.py report "$SKIPPED"
          python3 tests/mutation/select_shards.py report "$SKIPPED" --summary >> "$GITHUB_STEP_SUMMARY"

  exact-arithmetic:
    needs: changes
    if: needs.changes.outputs.arithmetic != 'none' && needs.changes.outputs.arithmetic != '' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: needs.changes.outputs.arithmetic == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-arithmetic-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-
      - name: Stryker
        working-directory: tests/mutation
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_FULL: ${{ github.event_name == 'pull_request' && '1' || '' }}   # (no full run on a PR, owner 2026-11-23; run_stryker.sh)
          G3_FULL_TESTS: ${{ github.event.schedule == '17 19 * * 0' && '1' || '' }}   # (the weekly run is unfiltered, decided by its cron line, not by the clock when a late shard starts)
          G3_LIMIT_SECONDS: '9000'                # the job's timeout-minutes (150) in seconds, for the early stop
        run: bash run_stryker.sh stryker-config.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (needs.changes.outputs.arithmetic == 'tests' || needs.changes.outputs.arithmetic == 'source' || github.event_name == 'pull_request') && 'warn' || 'error' }}
      - name: Upload the Stryker logs
        # (so that a shard cancelled at the job's limit still shows what ran: the test runs and Stryker's own log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-logs
          path: tests/mutation/StrykerOutput/*/logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && github.event_name != 'pull_request' && (needs.changes.outputs.arithmetic == 'full' || needs.changes.outputs.arithmetic == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline tests/mutation/stryker-config.json
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}

  exact-mesh:
    needs: changes
    if: startsWith(needs.changes.outputs.mesh, '[{') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # at most 6 shards at a time (owner 2026-11-13: short PR jobs must not wait for slots; it was 12, and 4 before: the 15 mesh
      # shards of a full run then took 4 waves, about 12 hours of wall time). The account runs at most 20 jobs at once; a full
      # run is 6 mesh shards + the arithmetic job + the selection job = 8, which leaves 12 for the CI of the PRs. The 45 mesh
      # configs of 1 to 6 hours each need more than a day when all run (`shards=all`), which is why the scheduled runs are
      # split into the nightly (24) and the weekly (22, the arithmetic job included) group (README "3.0 process"; the schedule guard skips a starter while a
      # plain run of the day is under way). Not a concurrency group: it keeps one pending job and cancels the
      # others. Scheduling only: it changes no shard's result (select_shards.py: not a reason for full runs)
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mesh) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: matrix.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-
      - name: Stryker
        working-directory: tests/mutation
        # a mutant can turn a loop into one that allocates without end: a heap limit per process makes that an
        # OutOfMemoryException in the test host (the mutant is killed) instead of a runner that runs out of memory
        env:
          DOTNET_GCHeapHardLimit: '0x180000000'   # 6 GB
          MODE: ${{ matrix.mode }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_FULL: ${{ github.event_name == 'pull_request' && '1' || '' }}   # (no full run on a PR, owner 2026-11-23; run_stryker.sh)
          G3_FULL_TESTS: ${{ github.event.schedule == '17 19 * * 0' && '1' || '' }}   # (the weekly run is unfiltered, decided by its cron line, not by the clock when a late shard starts)
        run: bash run_stryker.sh stryker-mesh-${{ matrix.shard }}.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Surviving mutants
        if: always()
        run: >
          jq -r '.files | to_entries[] | .key as $f | .value.mutants[]
          | select(.status == "Survived" or .status == "NoCoverage")
          | "\(.status) \($f | split("/") | last):\(.location.start.line) \(.mutatorName): \(.replacement // "" | gsub("\n"; " ") | .[0:160])"'
          tests/mutation/StrykerOutput/*/reports/mutation-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (matrix.mode == 'tests' || matrix.mode == 'source' || github.event_name == 'pull_request') && 'warn' || 'error' }}
      - name: Upload the Stryker logs
        # (so that a shard cancelled at the job's limit still shows what ran: the test runs and Stryker's own log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-logs-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/logs/
          retention-days: 7
          if-no-files-found: warn
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && github.event_name != 'pull_request' && (matrix.mode == 'full' || matrix.mode == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline "tests/mutation/stryker-mesh-$SHARD.json"
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles('.config/dotnet-tools.json', 'tests/mutation/BASELINE_FORMAT') }}-${{ github.run_id }}-${{ github.run_attempt }}
