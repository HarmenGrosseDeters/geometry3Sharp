name: Mutation tests

# Stryker.NET (Apache-2.0), tests/mutation, docs/QA.md 2.2: too slow for every PR, so on PRs that change the
# mutated files or their tests, weekly, and on demand. Two jobs:
# - exact-arithmetic: math/ExactPredicates.cs, ExactPoint3.cs, AdaptivePredicates.cs (about 50 minutes);
# - exact-mesh: the exact mesh pipeline (mesh_ops/ExactMesh*.cs, ExactPlanarSimplify.cs, ExactTriangulation2.cs,
#   MeshRoundingRepair.cs), in shards that run in parallel (tests/mutation/stryker-mesh-*.json).
# On a PR, the "changes" job starts only the job whose files changed. A run fails when a mutation score drops
# below the break threshold of its config; the reports list the surviving mutants.

on:
  pull_request:
    paths:
      - 'math/ExactPredicates.cs'
      - 'math/ExactPoint3.cs'
      - 'math/AdaptivePredicates.cs'
      - 'mesh_ops/ExactMesh*.cs'
      - 'mesh_ops/ExactPlanarSimplify.cs'
      - 'mesh_ops/ExactTriangulation2.cs'
      - 'mesh_ops/MeshRoundingRepair.cs'
      - 'tests/geometry3Sharp.Tests/ExactPredicatesTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactImplicitPointTests.cs'
      - 'tests/geometry3Sharp.Tests/PredicateDifferentialTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPoint3ConversionTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactMeshBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactFilterBoundTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactArrangementScalingTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPlanarSimplifyTests.cs'
      - 'tests/geometry3Sharp.Tests/MeshRoundingRepair*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactTriangulation2Tests.cs'
      - 'tests/geometry3Sharp.Tests/geometry3Sharp.Tests.csproj'
      - 'tests/mutation/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '23 3 * * 1'        # Mondays 03:23 UTC
  workflow_dispatch:

# a new push to the same PR cancels the running run
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # which jobs a PR needs (schedule and workflow_dispatch run both)
  changes:
    runs-on: ubuntu-latest
    outputs:
      arithmetic: ${{ steps.diff.outputs.arithmetic }}
      mesh: ${{ steps.diff.outputs.mesh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "arithmetic=true" >> "$GITHUB_OUTPUT"; echo "mesh=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          # the test project, the tools, the workflow and the building-block tests (they test both) start both jobs
          common='^(tests/geometry3Sharp\.Tests/geometry3Sharp\.Tests\.csproj|tests/geometry3Sharp\.Tests/ExactBooleanBuildingBlockTests\.cs|tests/mutation/README\.md|\.config/dotnet-tools\.json|\.github/workflows/mutation\.yml)$'
          arithmetic='^(math/(ExactPredicates|ExactPoint3|AdaptivePredicates)\.cs|tests/mutation/stryker-config\.json|tests/geometry3Sharp\.Tests/(ExactPredicates|ExactImplicitPoint|PredicateDifferential|ExactPoint3Conversion)Tests\.cs)$'
          mesh='^(mesh_ops/(ExactMesh[^/]*|ExactPlanarSimplify|ExactTriangulation2|MeshRoundingRepair)\.cs|tests/mutation/stryker-mesh-[^/]*\.json|tests/geometry3Sharp\.Tests/(ExactMeshBoolean[^/]*|ExactBoolean[^/]*|ExactFilterBound|ExactArrangementScaling|ExactPlanarSimplify|ExactTriangulation2|MeshRoundingRepair[^/]*)Tests\.cs)$'
          a=false; m=false
          if echo "$files" | grep -Eq "$common|$arithmetic"; then a=true; fi
          if echo "$files" | grep -Eq "$common|$mesh"; then m=true; fi
          echo "arithmetic=$a" >> "$GITHUB_OUTPUT"; echo "mesh=$m" >> "$GITHUB_OUTPUT"

  exact-arithmetic:
    needs: changes
    if: needs.changes.outputs.arithmetic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Stryker
        working-directory: tests/mutation
        run: dotnet stryker --config-file stryker-config.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/mutation/StrykerOutput/*/reports/
          if-no-files-found: error

  exact-mesh:
    needs: changes
    if: needs.changes.outputs.mesh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [rounding, boolean-1, boolean-2, arrangement-1, arrangement-2, planar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Stryker
        working-directory: tests/mutation
        # a mutant can turn a loop into one that allocates without end: a heap limit per process makes that an
        # OutOfMemoryException in the test host (the mutant is killed) instead of a runner that runs out of memory
        env:
          DOTNET_GCHeapHardLimit: '0x180000000'   # 6 GB
        run: dotnet stryker --config-file stryker-mesh-${{ matrix.shard }}.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Surviving mutants
        if: always()
        run: >
          jq -r '.files | to_entries[] | .key as $f | .value.mutants[]
          | select(.status == "Survived" or .status == "NoCoverage")
          | "\(.status) \($f | split("/") | last):\(.location.start.line) \(.mutatorName): \(.replacement // "" | gsub("\n"; " ") | .[0:160])"'
          tests/mutation/StrykerOutput/*/reports/mutation-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/reports/
          if-no-files-found: error
