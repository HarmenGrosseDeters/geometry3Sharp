name: Mutation tests

# Stryker.NET (Apache-2.0), tests/mutation, docs/QA.md 2.2: too slow for every PR, so in full weekly and on demand, and
# on ready PRs (not drafts) only for the configs that the PR touches (tests/mutation/select_shards.py). Two jobs:
# - exact-arithmetic: math/ExactPredicates.cs, ExactPoint3.cs, AdaptivePredicates.cs (about 50 minutes);
# - exact-mesh: the exact mesh pipeline (mesh_ops/ExactMesh*.cs, ExactPlanarSimplify.cs, ExactTriangulation2.cs,
#   MeshRoundingRepair.cs, math/FixedPoint3.cs, the arrangement's fixed-width points, and math/Generated/*.cs, the
#   generated predicates), in shards that run in
#   parallel (tests/mutation/stryker-mesh-*.json).
# A shard whose mutated file changed runs incrementally (tests/mutation/incremental.py): Stryker mutates only the changed
# lines, the other mutants keep their results from the last full run (the baseline, kept in the Actions cache), and the
# shard fails when the combined score drops below the break threshold of its config; without a cached baseline it runs
# in full. A shard whose config
# or tools changed runs in full. A shard of which only tests changed runs with --since and only reports. Every full run
# stores its report as the baseline. The reports list the surviving mutants.

on:
  pull_request:
    # (converted_to_draft: the concurrency group below cancels a run that is under way)
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'math/ExactPredicates.cs'
      - 'math/ExactPoint3.cs'
      - 'math/AdaptivePredicates.cs'
      - 'math/FixedPoint3.cs'
      - 'math/Generated/*.cs'
      - 'mesh_ops/ExactMesh*.cs'
      - 'mesh_ops/ExactPlanarSimplify.cs'
      - 'mesh_ops/ExactTriangulation2.cs'
      - 'mesh_ops/MeshRoundingRepair.cs'
      - 'tests/geometry3Sharp.Tests/ExactPredicatesTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactImplicitPointTests.cs'
      - 'tests/geometry3Sharp.Tests/PredicateDifferentialTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPoint3ConversionTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPoint3FixedWidthTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactOrient3dKernelTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactTouchOnlyCoplanarTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPlanesFixedWidthTests.cs'
      - 'tests/geometry3Sharp.Tests/GeneratedPredicatesIndirectTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactMeshBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactBoolean*Tests.cs'
      - 'tests/geometry3Sharp.Tests/ExactFilterBoundTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactArrangementScalingTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactPlanarSimplifyTests.cs'
      - 'tests/geometry3Sharp.Tests/MeshRoundingRepair*Tests.cs'
      - 'tests/geometry3Sharp.Tests/SafeRoundingBoundTests.cs'
      - 'tests/geometry3Sharp.Tests/ExactBooleanPropertyFindings.cs'
      - 'tests/geometry3Sharp.Tests/ExactTriangulation2Tests.cs'
      - 'tests/geometry3Sharp.Tests/BooleanPerformanceTests.cs'
      - 'tests/mutation/*'
      - '.config/dotnet-tools.json'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '23 3 * * 1'        # Mondays 03:23 UTC
  workflow_dispatch:
    inputs:
      shards:
        description: 'Shards to run in full: all, or a comma-separated list (arithmetic, rounding, boolean-1, ...)'
        default: all

# a new push to the same PR cancels the running run
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # which configs a PR needs, and how (schedule and workflow_dispatch run all of them in full). Runs on drafts too, so
  # that the selection can be seen there; the jobs below wait for "ready for review".
  changes:
    runs-on: ubuntu-latest
    outputs:
      arithmetic: ${{ steps.select.outputs.arithmetic }}
      mesh: ${{ steps.select.outputs.mesh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the selection and the baseline tooling
        working-directory: tests/mutation
        run: |
          python3 test_select_shards.py
          python3 test_baseline.py
          python3 test_incremental.py
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          SHARDS: ${{ github.event.inputs.shards }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # a failed git diff must fail this step: empty input would select nothing and skip the runs in green
          set -o pipefail
          if [ "$EVENT" != "pull_request" ]; then
            python3 tests/mutation/select_shards.py --all --only "${SHARDS:-all}" | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE...$HEAD" | python3 tests/mutation/select_shards.py | tee -a "$GITHUB_OUTPUT"
          fi

  exact-arithmetic:
    needs: changes
    if: needs.changes.outputs.arithmetic != 'none' && needs.changes.outputs.arithmetic != '' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: needs.changes.outputs.arithmetic == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-
      - name: Stryker
        working-directory: tests/mutation
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash run_stryker.sh stryker-config.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (needs.changes.outputs.arithmetic == 'tests' || needs.changes.outputs.arithmetic == 'source') && 'warn' || 'error' }}
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && (needs.changes.outputs.arithmetic == 'full' || needs.changes.outputs.arithmetic == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ needs.changes.outputs.arithmetic }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-arithmetic-${{ hashFiles('tests/mutation/stryker-config.json', '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

  exact-mesh:
    needs: changes
    if: startsWith(needs.changes.outputs.mesh, '[{') && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # at most 4 shards at a time: a full run leaves runners free for CI (the account runs about 20 jobs at once)
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.mesh) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since needs the history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore the baseline
        id: restore
        if: matrix.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-
      - name: Stryker
        working-directory: tests/mutation
        # a mutant can turn a loop into one that allocates without end: a heap limit per process makes that an
        # OutOfMemoryException in the test host (the mutant is killed) instead of a runner that runs out of memory
        env:
          DOTNET_GCHeapHardLimit: '0x180000000'   # 6 GB
          MODE: ${{ matrix.mode }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash run_stryker.sh stryker-mesh-${{ matrix.shard }}.json
      - name: Summary
        if: always()
        run: cat tests/mutation/StrykerOutput/*/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Surviving mutants
        if: always()
        run: >
          jq -r '.files | to_entries[] | .key as $f | .value.mutants[]
          | select(.status == "Survived" or .status == "NoCoverage")
          | "\(.status) \($f | split("/") | last):\(.location.start.line) \(.mutatorName): \(.replacement // "" | gsub("\n"; " ") | .[0:160])"'
          tests/mutation/StrykerOutput/*/reports/mutation-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-mesh-${{ matrix.shard }}
          path: tests/mutation/StrykerOutput/*/reports/
          # (tests: a --since run may have nothing to test; source: a shard with no changed line runs no Stryker)
          if-no-files-found: ${{ (matrix.mode == 'tests' || matrix.mode == 'source') && 'warn' || 'error' }}
      - name: Prepare the baseline
        id: store
        # (after a full run, also a source run that ran in full for want of a baseline: run_stryker.sh marks it)
        if: always() && (matrix.mode == 'full' || matrix.mode == 'source')
        run: |
          if [ "$MODE" = full ] || [ -f tests/mutation/StrykerOutput/full-run ]; then
            python3 tests/mutation/baseline.py store tests/mutation/StrykerOutput tests/mutation/baseline
          else
            echo "stored=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          MODE: ${{ matrix.mode }}
      - name: Store the baseline
        if: always() && steps.store.outputs.stored == 'true'
        uses: actions/cache/save@v4
        with:
          path: tests/mutation/baseline
          key: mutation-baseline-mesh-${{ matrix.shard }}-${{ hashFiles(format('tests/mutation/stryker-mesh-{0}.json', matrix.shard), '.config/dotnet-tools.json', 'tests/mutation/baseline.py', 'tests/mutation/incremental.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
