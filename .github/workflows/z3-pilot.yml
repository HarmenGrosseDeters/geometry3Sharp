name: Z3 pilot
on:
  pull_request:
    paths:
      - 'tools/Z3Pilot/**'
      - 'comp_geom/SnapRounding2.cs'
      - 'benchmarks/Meshing2Benchmark/Oracle/Oracle.cs'
      - 'benchmarks/Meshing2Benchmark/Oracle/Exact.cs'
      - '.github/workflows/z3-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/Z3Pilot/requirements.txt
      # The solver runs once: test_all_obligations_and_exact_witness_replay runs the full pilot
      # and writes the report that is uploaded below.
      - run: python -m unittest discover -s tools/Z3Pilot -p 'test_*.py' -v
        env:
          Z3_PILOT_TIMEOUT_MS: '120000'
          Z3_PILOT_REPORT: z3-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z3-pilot
          path: z3-report.json
