name: Z3 pilot
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/Z3Pilot/**'
      - 'mesh_ops/PolyhedralEnvelope.cs'
      - 'mesh_ops/ExactMeshGeodesicDistance.cs'
      - 'math/ExactDoubleWord.cs'
      - 'math/ExactIntervals.cs'
      - 'math/AxisAlignedBox3d.cs'
      - 'comp_geom/SnapRounding2.cs'
      - 'mesh_generators/MarchingCubes.cs'
      - 'mesh_generators/MarchingCubesPro.cs'
      - 'benchmarks/Meshing2Benchmark/Oracle/Oracle.cs'
      - 'benchmarks/Meshing2Benchmark/Oracle/Exact.cs'
      # pilot 2: the filter rules of the predicate generator and the generated filters
      - 'tools/PredicateCompiler/Compiler.cs'
      - 'math/Generated/IndirectPredicates.cs'
      # pilot 2 step 1: the drift accounting of SafeRounding (the apex rule of Boolean 2.0, D1; step 1b the reference rule, its source contract)
      - 'mesh_ops/MeshRoundingRepair.cs'
      # pilot 2 step 1b: the rounding model of the reference rule (drift_reference.py, its source contract)
      - 'math/Vector3d.cs'
      # pilot 6: the frame of the Clipper2 adapter (clipper_frame.py, its source contract)
      - 'addons/geometry3Sharp.Clipper2/ClipperFrame.cs'
      # pilot 3: the Devillers-Guigue prefilter of the arrangement (tritri_prefilter.py, its source contract)
      - 'mesh_ops/ExactMeshArrangement.cs'
      # pilot 4: the termination of the midpoint split of the AABB tree build (split_termination.py, its source contract)
      - 'spatial/DMeshAABBTree.cs'
      # pilot 7: the separating-axis prefilter prototype (separating_axis.py, its source contract)
      - 'benchmarks/SnapRoundingExperiment/CandidateCulling.cs'
      # pilot 8: the plateau variant of the position search, a design (plateau_search.py, its source contract on the probe)
      - 'benchmarks/SnapRoundingExperiment/LatticeProbe.cs'
      - 'math/Interval1d.cs'
      - 'intersection/ContinuousCollision.cs'
      - 'intersection/IntrExactBox3.cs'
      - 'mesh_ops/TerrainSlopeDesign.cs'
      - 'math/AxisAlignedBox2d.cs'
      - 'math/MathUtil.cs'
      - 'implicit/CachingGridImplicit3d.cs'
      - 'mesh_ops/IntrinsicIntegerCoordinates.cs'
      # the exact-bound inventory (docs/qa/exact-bound-inventory.md): the expansion range (adaptive_range.py, its source
      # contract also scans the library for unguarded calls of AdaptivePredicates), may_meet_box (may_meet_box.py) and the
      # corner error of the terrain prefilter (slope_approx.py)
      - 'math/ExactPredicates.cs'
      - 'math/AdaptivePredicates.cs'
      - 'mesh_generators/DualContouring.cs'
      - 'mesh_ops/ContouringTopologyCertificate.cs'
      - 'math/ExactSlopeKernel.cs'
      - 'mesh_ops/TerrainSlopeMap.cs'
      - 'tools/ErrorBoundAudit/range_callers.py'
      # pilot 9: the segment test and the wide bound of the Antipodal sum (antipodal_segment.py, its source contract)
      - 'mesh_ops/ExactMeshBoolean.cs'
      - 'math/ExactLimbSigns.cs'
      - 'mesh_generators/TwoLevelMarchingTetrahedra.cs'
      - 'math/ExactRayTriangle.cs'
      - 'math/ExactPoint3.cs'
      - 'mesh_ops/MeshAlphaWrap.cs'
      - 'mesh_ops/AlphaWrapOracle.cs'
      - '.github/workflows/z3-pilot.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Fast gate or one extended solver suite
        type: choice
        default: fast
        options:
          - fast
          - adaptive_range
          - clipper_frame
          - conservative_mc
          - drift_reference
          - may_meet_box
          - pilot
          - rounding_oracle
          - separating_axis
          - split_termination
permissions:
  contents: read
jobs:
  verify:
    # a draft PR runs nothing here (owner 2026-11-23, runner load); marking it ready starts the run
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r tools/Z3Pilot/requirements.txt
      - name: Run Z3 verification
        shell: bash
        run: |
          if [[ "$Z3_SUITE" != fast ]]; then
            test -f "tools/Z3Pilot/test_${Z3_SUITE}.py"
            python -m unittest discover -s tools/Z3Pilot -p "test_${Z3_SUITE}.py" -v
            exit
          fi
          for file in tools/Z3Pilot/test_*.py; do
            suite=${file##*/}
            case "$suite" in
              test_adaptive_range.py|test_clipper_frame.py|test_conservative_mc.py|test_drift_reference.py|test_may_meet_box.py|test_pilot.py|test_rounding_oracle.py|test_separating_axis.py|test_split_termination.py)
                continue ;;
            esac
            timeout 10s python -m unittest discover -s tools/Z3Pilot -p "$suite" -v
          done
        env:
          Z3_SUITE: ${{ inputs.suite || 'fast' }}
          Z3_PILOT_TIMEOUT_MS: ${{ (inputs.suite && inputs.suite != 'fast') && '120000' || '8000' }}
          Z3_PILOT_REPORT: z3-report.json
          Z3_NUMERICAL_CERTIFICATE_REPORT: z3-numerical-certificates-report.json
          Z3_FILTER_RULES_REPORT: z3-filter-rules-report.json
          Z3_CONSERVATIVE_MC_REPORT: z3-conservative-mc-report.json
          Z3_DRIFT_APEX_REPORT: z3-drift-apex-report.json
          Z3_CLIPPER_FRAME_REPORT: z3-clipper-frame-report.json
          Z3_DRIFT_REFERENCE_REPORT: z3-drift-reference-report.json
          Z3_STEP_LOOPS_REPORT: z3-step-loops-report.json
          Z3_TRITRI_REPORT: z3-tritri-report.json
          Z3_SPLIT_TERMINATION_REPORT: z3-split-termination-report.json
          Z3_PILOT_FOLLOWUPS_REPORT: z3-pilot-followups-report.json
          Z3_SEPARATING_AXIS_REPORT: z3-separating-axis-report.json
          Z3_INTERVAL_SEGMENT_REPORT: z3-interval-segment-report.json
          Z3_PLATEAU_SEARCH_REPORT: z3-plateau-search-report.json
          Z3_ADAPTIVE_RANGE_REPORT: z3-adaptive-range-report.json
          Z3_RAY_AABB_MAY_REPORT: z3-ray-aabb-may-report.json
          Z3_TERRAIN_BOX_REPORT: z3-terrain-box-expansion-report.json
          Z3_SATURATING_CONVERSIONS_REPORT: z3-saturating-conversions-report.json
          Z3_INTRINSIC_FLIP_REPORT: z3-intrinsic-flip-report.json
          Z3_CONTINUOUS_COLLISION_REPORT: z3-continuous-collision-report.json
          Z3_MAY_MEET_BOX_REPORT: z3-may-meet-box-report.json
          Z3_SLOPE_APPROX_REPORT: z3-slope-approx-report.json
          Z3_LIMB_NEGATION_REPORT: z3-limb-negation-report.json
          Z3_TETRAHEDRA_SHARED_FACES_REPORT: z3-tetrahedra-shared-faces-report.json
          Z3_RAY_SECOND_POINT_REPORT: z3-ray-second-point-report.json
          Z3_ANTIPODAL_SEGMENT_REPORT: z3-antipodal-segment-report.json
          Z3_ALPHA_WRAP_PINCH_BISECTION_REPORT: z3-alpha-wrap-pinch-bisection-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z3-pilot
          path: |
            z3-report.json
            z3-numerical-certificates-report.json
            z3-filter-rules-report.json
            z3-conservative-mc-report.json
            z3-drift-apex-report.json
            z3-clipper-frame-report.json
            z3-drift-reference-report.json
            z3-step-loops-report.json
            z3-tritri-report.json
            z3-split-termination-report.json
            z3-pilot-followups-report.json
            z3-separating-axis-report.json
            z3-interval-segment-report.json
            z3-plateau-search-report.json
            z3-adaptive-range-report.json
            z3-ray-aabb-may-report.json
            z3-terrain-box-expansion-report.json
            z3-saturating-conversions-report.json
            z3-intrinsic-flip-report.json
            z3-continuous-collision-report.json
            z3-may-meet-box-report.json
            z3-slope-approx-report.json
            z3-limb-negation-report.json
            z3-tetrahedra-shared-faces-report.json
            z3-ray-second-point-report.json
            z3-antipodal-segment-report.json
            z3-alpha-wrap-pinch-bisection-report.json
