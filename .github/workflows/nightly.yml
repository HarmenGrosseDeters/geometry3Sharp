name: Nightly

# The tests tagged [Trait("Category", "Nightly")]: checks whose run is the check and takes more than 10 s (CLAUDE.md, "Test time";
# docs/QA.md, "Test tiers"), e.g. the exact reference path of the 2D mesher oracle on its largest catalogue rows. They do not run in
# PR or master CI (ci.yml excludes the category). Daily on master, and on demand. Started by the external dispatcher at 02:30 UTC
# (workflow_dispatch; `alkis_only` is a custom run) and, as the fallback, by the cron line, which GitHub runs hours late: the guard job keeps it to one run a day.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run although a daily run of today already ran or is running (the schedule guard)'
        type: boolean
        default: false
      alkis_only:
        description: 'Run only the ALKIS job (to time it cold and warm)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Runs once a day although two things start it (docs/QA.md, "Scheduled runs"): the external dispatcher at a fixed time and the
  # cron line as the fallback. Skips when an earlier plain daily run of today is under way or green (tools/schedule_guard.py).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - name: Schedule guard${{ github.event_name == 'workflow_dispatch' && inputs.alkis_only && ' [custom]' || '' }}
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          FORCE: ${{ inputs.force }}
          CUSTOM: ${{ github.event_name == 'workflow_dispatch' && inputs.alkis_only }}
        run: python3 tools/schedule_guard.py --workflow nightly.yml --event "$EVENT" --run-id "$RUN_ID" --branch "$BRANCH" --default-branch "$DEFAULT_BRANCH" --custom "$CUSTOM" --force "$FORCE"

  nightly:
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' && !inputs.alkis_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test (net10.0, Category=Nightly)
        run: dotnet test tests/geometry3Sharp.Tests -c Release --filter "Category=Nightly" --logger "trx;LogFileName=nightly.trx" --results-directory test-results
      - name: Durations
        if: always()
        run: python3 tools/trx_durations.py test-results/nightly.trx --top 30 --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: test-results/

  # Real cadastral tiles (ALKIS, Geobasis NRW, dl-de/zero-2-0), fetched at run time; nothing is committed. A fixed subset of the sample
  # of benchmarks/Meshing2Benchmark/corpus/alkis_sample.py (the first tile of each of the 10 strata): mesher and oracle on every
  # input, every run VALID except the findings listed in alkis_known.json (a ratchet). The prepared inputs (about 2 MB) are cached,
  # keyed by the preparation version and the host's listing of the six districts; a cold run downloads about 1 GB of district archives.
  alkis:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALKIS_DIR: ${{ github.workspace }}/alkis-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache key (preparation version and the host's listing)
        id: key
        run: |
          mkdir -p "$ALKIS_DIR/zips"
          echo "key=$(python3 benchmarks/Meshing2Benchmark/corpus/alkis_sample.py --cache-key --first 1 --cache "$ALKIS_DIR/zips")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ env.ALKIS_DIR }}/sample
          key: ${{ steps.key.outputs.key }}
      - name: Fetch and prepare the tiles (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 benchmarks/Meshing2Benchmark/corpus/alkis_sample.py --draw --first 1 --cache "$ALKIS_DIR/zips" --out "$ALKIS_DIR/sample"
      # saved right after the preparation, not at the end of the job: a night with a finding (the job fails) still fills the cache
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.ALKIS_DIR }}/sample
          key: ${{ steps.key.outputs.key }}
      - name: Build the benchmark
        run: dotnet build benchmarks/Meshing2Benchmark -c Release -f net10.0
      - name: Mesh and judge
        run: |
          rm -f "$ALKIS_DIR/sample/results.jsonl"
          python3 benchmarks/Meshing2Benchmark/corpus/alkis_run.py --sample "$ALKIS_DIR/sample" --known benchmarks/Meshing2Benchmark/corpus/alkis_known.json --expect-runs 50 --timeout 300
      - name: Table
        if: ${{ always() && hashFiles('alkis-data/sample/results.jsonl') != '' }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 benchmarks/Meshing2Benchmark/corpus/alkis_run.py --sample "$ALKIS_DIR/sample" --summary >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alkis-results
          path: ${{ env.ALKIS_DIR }}/sample/results.jsonl
