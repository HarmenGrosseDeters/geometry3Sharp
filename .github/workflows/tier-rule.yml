# The tier rule of the golden-master policy (docs/design/DETERMINISM.md 6b): a documented operation of tier 1
# (tools/DeterminismReach/tier1.txt) may not gain a call path to the platform libm. Light (a build of the library and a
# read of its IL: about a minute). It is a merge-gate check, so on a pull request it is the job tier-rule of ci.yml (the full
# stage, label `full-ci`, covered by the status full-ci; owner 2026-11-23); this workflow is its manual run, and determinism.yml
# runs the same check next to the cross-runtime comparison.
name: tier-rule

on:
  # (pull requests: the job tier-rule of ci.yml, in the full stage, owner 2026-11-23, so the merge gate full-ci covers it; this
  # workflow stays for a manual run)
  workflow_dispatch:

jobs:
  tier-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build geometry3Sharp_netstandard.csproj -c Release -f net10.0
      - run: dotnet build tools/DeterminismReach -c Release
      - name: Self-test and tier rule
        run: |
          R="dotnet tools/DeterminismReach/bin/Release/net10.0/DeterminismReach.dll"
          $R self-test
          $R tier bin/Release/net10.0/geometry3Sharp.dll --docs docs/OPERATIONS.md --docs docs/guides \
            --baseline tools/DeterminismReach/tier1.txt
