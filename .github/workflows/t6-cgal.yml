name: T6 comparison (CGAL EPECK or Geogram)

# Exact Boolean 3.0 target T6 (docs/roadmap/exact-boolean.md): time ratio ours / CGAL EPECK on 1k-100k triangles. Manual only
# (workflow_dispatch): the job fetches the Thingi10K models from huggingface at run time, which a PR-tier test never does.
# CGAL runs only here, as a black box on a GitHub-hosted runner (owner decision 2026-11-15): cgal_bool.cpp (the repo's own
# driver) is built against the runner's libcgal-dev (GPL, the binary is not distributed); no CGAL source is read or ported.
# Two jobs, one thread and all cores for ours (CGAL is single-threaded). Raw rows go to the data branch runs/t6-cgal.
# Case set and report: benchmarks/BooleanComparison/perf/t6.py. No mesh is committed.
# The same run against Geogram (methods ours,geogram; docs/research/GEOGRAM_BOOLEAN_COMPARISON_2026-11.md): geogram (BSD-3) is
# fetched at a pinned commit and built on the runner by external/build_geogram.sh (from the ref the workflow runs on), without
# Triangle or any TetGen path (sparse clone, both switches off, checked); the binary is not distributed. Geogram is multi-threaded:
# in the one-thread job both tools are pinned to core 0 and geogram is capped at one thread (GEOGRAM_THREADS=1).
on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: 'Ref of the library and benchmark tool to measure'
        default: 'master'
      timeout_s:
        description: 'Timeout per boolean in seconds'
        default: '300'
      methods:
        description: 'ours and the method to compare with: ours,cgal_epeck or ours,geogram'
        default: 'ours,cgal_epeck'
        type: choice
        options: ['ours,cgal_epeck', 'ours,geogram']
      max_pairs:
        description: 'Only the first N pairs of the case set (0: all; for a smoke run)'
        default: '0'
      geogram_warmup:
        description: 'Geogram: run each boolean twice, time the second (ms) and record the first (cold_ms); ours always times after a warm-up run'
        type: boolean
        default: false

permissions:
  contents: write   # the data branch runs/t6-cgal

jobs:
  measure:
    if: github.repository == 'harmengrossedeters/geometry3Sharp'
    runs-on: ubuntu-latest   # GitHub-hosted only, never self-hosted
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        threads: ['1', 'all']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.library_ref }}
          path: lib
      - uses: actions/checkout@v4
        with:
          path: scripts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build cgal_bool (CGAL from apt, used as a black box)
        if: ${{ inputs.methods == 'ours,cgal_epeck' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcgal-dev libgmp-dev libmpfr-dev
          g++ -O2 -std=c++17 -DNDEBUG -DCGAL_NDEBUG lib/benchmarks/BooleanComparison/external/cgal_bool.cpp -o cgal_bool -lgmp -lmpfr
          dpkg -s libcgal-dev | grep '^Version'
      - name: Build geogram_bool (geogram BSD-3 at a pinned commit, without Triangle and TetGen)
        if: ${{ inputs.methods == 'ours,geogram' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake libtbb-dev
          bash scripts/benchmarks/BooleanComparison/external/build_geogram.sh "$RUNNER_TEMP/geogram"
          cp "$RUNNER_TEMP/geogram/geogram_bool" geogram_bool
      - name: Build the benchmark tool
        env:
          METHODS: ${{ inputs.methods }}
        run: |
          dotnet build lib/benchmarks/BooleanComparison/BooleanComparison.csproj -c Release
          cp -r lib/benchmarks/BooleanComparison/bin/Release/net10.0 frozen
          git -C lib rev-parse HEAD > lib_sha.txt
          nproc >> lib_sha.txt
          if [ "$METHODS" = ours,geogram ]; then cat "$RUNNER_TEMP/geogram/geogram_version.txt" >> lib_sha.txt; git -C scripts rev-parse HEAD >> lib_sha.txt
          else dpkg -s libcgal-dev | grep '^Version' >> lib_sha.txt; fi
      - name: Case set and models
        env:
          MAX_PAIRS: ${{ inputs.max_pairs }}
        run: |
          [[ "$MAX_PAIRS" =~ ^[0-9]+$ ]] || { echo "max_pairs must be a number"; exit 1; }
          S=scripts/benchmarks/BooleanComparison
          python3 $S/perf/t6.py pairs pairs_t6.csv
          if [ "$MAX_PAIRS" -gt 0 ]; then head -n "$((MAX_PAIRS + 2))" pairs_t6.csv > p.csv && mv p.csv pairs_t6.csv; fi   # a comment and the header
          python3 $S/perf/t6.py fetch data pairs_t6.csv
          python3 $S/data/thingi_pairs.py manifest pairs_t6.csv data cases.jsonl
      - name: Run ours and the other method
        env:
          CGAL_BOOL: ${{ github.workspace }}/cgal_bool
          GEOGRAM_BOOL: ${{ github.workspace }}/geogram_bool
          BOOLCMP_TOOL: ${{ github.workspace }}/frozen/BooleanComparison.dll
          METHODS: ${{ inputs.methods }}
          TIMEOUT: ${{ inputs.timeout_s }}
          GEOGRAM_WARMUP: ${{ inputs.geogram_warmup && '1' || '' }}
        run: |
          S=scripts/benchmarks/BooleanComparison
          if [ "${{ matrix.threads }}" = 1 ]; then export DOTNET_PROCESSOR_COUNT=1 GEOGRAM_THREADS=1; PIN="taskset -c 0"; else PIN=""; fi
          $PIN python3 $S/compare.py cases.jsonl results-${{ matrix.threads }}.jsonl --methods "$METHODS" --timeout "$TIMEOUT" -j 1 --resume
      - name: Report
        if: always()
        env:
          METHODS: ${{ inputs.methods }}
        run: |
          [ -f "results-${{ matrix.threads }}.jsonl" ] || { echo "no results (an earlier step failed)"; exit 0; }
          python3 scripts/benchmarks/BooleanComparison/perf/t6.py report --other "${METHODS#ours,}" "${{ matrix.threads }} thread(s)=results-${{ matrix.threads }}.jsonl" | tee report-${{ matrix.threads }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t6-${{ matrix.threads }}-${{ inputs.methods == 'ours,geogram' && 'geogram' || 'cgal' }}
          path: |
            results-${{ matrix.threads }}.jsonl
            report-${{ matrix.threads }}.md
            lib_sha.txt
            pairs_t6.csv

  publish:
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true      # the measure jobs may have failed before they uploaded anything
        with:
          path: art
      - name: Raw rows to runs/t6-cgal
        run: |
          d=$(mktemp -d)
          git worktree add -q --detach "$d"
          cd "$d"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin runs/t6-cgal > /dev/null; then
            git fetch -q --depth=1 origin runs/t6-cgal:refs/remotes/origin/runs/t6-cgal
            git checkout -q -B runs/t6-cgal origin/runs/t6-cgal
          else
            git checkout -q --orphan runs/t6-cgal
            git rm -rqf .
          fi
          mkdir -p "run-$GITHUB_RUN_ID" && cp -r "$GITHUB_WORKSPACE"/art/*/* "run-$GITHUB_RUN_ID"/ 2>/dev/null || true
          git add .
          git diff --cached --quiet && exit 0
          git commit -q -m "T6 comparison run $GITHUB_RUN_ID (${{ inputs.methods }})"
          git push origin runs/t6-cgal
