name: Meshing recheck tools
on:
  pull_request:
    paths:
      - 'benchmarks/Meshing2Benchmark/rechecks/**'
      - '.github/workflows/meshing-recheck-tools.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/Meshing2Benchmark/rechecks/requirements.txt
      - run: python -m unittest discover -s benchmarks/Meshing2Benchmark/rechecks -p 'test_*.py' -v
