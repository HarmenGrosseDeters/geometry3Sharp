name: Meshing recheck tools
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'benchmarks/Meshing2Benchmark/rechecks/**'
      - '.github/workflows/meshing-recheck-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meshing-recheck-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    # a draft PR runs nothing here (owner 2026-11-23, runner load); marking it ready starts the run
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/Meshing2Benchmark/rechecks/requirements.txt
      - run: python -m unittest discover -s benchmarks/Meshing2Benchmark/rechecks -p 'test_*.py' -v
