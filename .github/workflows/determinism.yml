# Bit-for-bit determinism across runtimes (docs/design/DETERMINISM.md): the harness in tools/DeterminismHarness runs fixed
# procedural inputs through the main operations on net10.0 (Linux and Windows) and net48 (Windows, the netstandard2.0
# build of the library), serial and parallel, and the compare job lists every case whose values differ with the first
# diverging value. Not part of the PR gate: it runs when the harness changes, and on demand.
name: determinism

on:
  pull_request:
    paths:
      - 'tools/DeterminismHarness/**'
      - 'tools/DeterminismReach/**'
      - 'docs/examples/**'
      - 'benchmarks/CoreMathBenchmark/**'
      - '.github/workflows/determinism.yml'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run macos-arm64 and macos-x64 (not in the default set: GitHub macOS runner capacity)'
        type: boolean
        default: false
      suite:
        description: 'Also run the PR-tier test suite on linux-arm64 (its golden masters on a second architecture; about half an hour)'
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tools/DeterminismHarness -c Release -f net10.0
      - name: Run
        run: |
          H="dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll"
          $H run --out out/linux-net10-parallel
          $H run --out out/linux-net10-parallel2
          $H run --out out/linux-net10-serial --serial
          # the partitioning of the library's parallel loops depends on the processor count
          for n in 1 2 3 8; do DOTNET_PROCESSOR_COUNT=$n $H run --out out/linux-net10-cpu$n; done
      # one machine as several: the JIT without vector instructions (no Vector256 winding kernel, no hardware FMA in
      # CoreMath), with 128-bit vectors only, without tiering (everything fully optimized at the first call), and
      # unoptimized (docs/research/DETERMINISM_CROSS_RUNTIME_2026-11.md section 3)
      - name: Run under JIT and CPU-feature switches
        run: |
          H="dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll"
          lscpu | grep -E "Model name|^CPU\(s\)"
          DOTNET_EnableHWIntrinsic=0 $H run --out out/linux-net10-jit-nohw --serial
          DOTNET_EnableAVX2=0 $H run --out out/linux-net10-jit-noavx2 --serial
          DOTNET_TieredCompilation=0 $H run --out out/linux-net10-jit-notiered --serial
          DOTNET_JITMinOpts=1 $H run --out out/linux-net10-jit-minopts --serial
          grep -H "^# machine" out/*/summary.txt
      - name: Cost of the correctly rounded CoreMath (benchmarks/CoreMathBenchmark)
        run: |
          dotnet build benchmarks/CoreMathBenchmark -c Release
          dotnet benchmarks/CoreMathBenchmark/bin/Release/net10.0/CoreMathBenchmark.dll
      - uses: actions/upload-artifact@v4
        with:
          name: traces-linux
          path: out
      # (after the upload: a difference fails this job, and the traces are still there for the comparison's diagnosis)
      - name: Schedule adversary (gParallel's loops backwards and in seeded permutations)
        run: dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll adversary --seeds 5
      # (after the upload and the adversary: a failure here does not cost the traces)
      - name: Static reachability of the sources of differences (tools/DeterminismReach)
        run: |
          dotnet build tools/DeterminismReach -c Release
          R="dotnet tools/DeterminismReach/bin/Release/net10.0/DeterminismReach.dll"
          $R self-test
          $R report tools/DeterminismHarness/bin/Release/net10.0/geometry3Sharp.dll --docs docs/OPERATIONS.md --docs docs/guides \
            --harness tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll
          # the tier rule of the golden-master policy (docs/design/DETERMINISM.md 6b): a tier 1 type may not gain a libm edge
          $R tier tools/DeterminismHarness/bin/Release/net10.0/geometry3Sharp.dll --docs docs/OPERATIONS.md --docs docs/guides \
            --baseline tools/DeterminismReach/tier1.txt
          python3 -m unittest discover -s tools/DeterminismHarness -p 'test_scope_report.py'

  # arm64: the same harness on a GitHub-hosted Linux arm64 runner, compared with the x64 traces in `compare`. macOS arm64 is
  # opt-in (workflow_dispatch input `macos`): its runners queue for a long time and the job was cancelled in the queue.
  arm64:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos && '[{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-arm64","os":"windows-11-arm"},{"name":"macos-arm64","os":"macos-latest"},{"name":"macos-x64","os":"macos-15-intel","optional":true}]' || '[{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-arm64","os":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.os }}
    # windows-arm64 is a standing leg (owner 2026-11-22; green on the runs of #1306 and #1328: 44993751694, 44997948786); only
    # macos-x64 is a measurement, whose failure does not stop `compare`
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tools/DeterminismHarness -c Release -f net10.0
      - name: Run
        shell: bash
        run: |
          H="dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll"
          uname -m
          $H run --out out/${{ matrix.name }}-net10-parallel
          $H run --out out/${{ matrix.name }}-net10-parallel2
          $H run --out out/${{ matrix.name }}-net10-serial --serial
          for n in 1 3; do DOTNET_PROCESSOR_COUNT=$n $H run --out out/${{ matrix.name }}-net10-cpu$n; done
          DOTNET_EnableHWIntrinsic=0 $H run --out out/${{ matrix.name }}-net10-jit-nohw --serial
          DOTNET_TieredCompilation=0 $H run --out out/${{ matrix.name }}-net10-jit-notiered --serial
          dotnet build benchmarks/CoreMathBenchmark -c Release -f net10.0
          dotnet benchmarks/CoreMathBenchmark/bin/Release/net10.0/CoreMathBenchmark.dll
      # the net48 harness on Windows arm64: the header of the run prints the process architecture. On the hosted runner it is
      # X64 (the AnyCPU build runs as an emulated x64 process), so this is the x64 C runtime on another CPU, not the arm64 JIT
      - name: Run net48 (Windows arm64)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet build tools/DeterminismHarness -c Release -f net48
          tools/DeterminismHarness/bin/Release/net48/DeterminismHarness.exe run --out out/${{ matrix.name }}-net48-parallel
          tools/DeterminismHarness/bin/Release/net48/DeterminismHarness.exe run --out out/${{ matrix.name }}-net48-serial --serial
      # (always: the net10.0 traces of a leg whose net48 step failed are still compared)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces-${{ matrix.name }}
          path: out

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tools/DeterminismHarness -c Release
      - name: Run
        shell: bash
        run: |
          B=tools/DeterminismHarness/bin/Release
          dotnet $B/net10.0/DeterminismHarness.dll run --out out/windows-net10-parallel
          dotnet $B/net10.0/DeterminismHarness.dll run --out out/windows-net10-serial --serial
          DOTNET_EnableHWIntrinsic=0 dotnet $B/net10.0/DeterminismHarness.dll run --out out/windows-net10-jit-nohw --serial
          DOTNET_TieredCompilation=0 dotnet $B/net10.0/DeterminismHarness.dll run --out out/windows-net10-jit-notiered --serial
          $B/net48/DeterminismHarness.exe run --out out/windows-net48-parallel
          $B/net48/DeterminismHarness.exe run --out out/windows-net48-parallel2
          $B/net48/DeterminismHarness.exe run --out out/windows-net48-serial --serial
      - name: Run net48 as a 32-bit process (x87 / legacy JIT arithmetic)
        shell: bash
        run: |
          dotnet build tools/DeterminismHarness -c Release -f net48 -p:PlatformTarget=x86 -o tools/DeterminismHarness/bin/x86
          tools/DeterminismHarness/bin/x86/DeterminismHarness.exe run --out out/windows-net48x86-serial --serial
      - name: Cost of the correctly rounded CoreMath, net10.0 (hardware FMA) and net48 (software FMA)
        shell: bash
        run: |
          dotnet build benchmarks/CoreMathBenchmark -c Release
          dotnet benchmarks/CoreMathBenchmark/bin/Release/net10.0/CoreMathBenchmark.dll
          benchmarks/CoreMathBenchmark/bin/Release/net48/CoreMathBenchmark.exe
      - uses: actions/upload-artifact@v4
        with:
          name: traces-windows
          path: out
      - name: Schedule adversary on net48
        shell: bash
        run: tools/DeterminismHarness/bin/Release/net48/DeterminismHarness.exe adversary --seeds 3

  compare:
    needs: [linux, windows, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: traces
          merge-multiple: true
      - run: dotnet build tools/DeterminismHarness -c Release -f net10.0
      - name: Compare
        run: |
          H="dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll"
          cmp() { echo "=== $1  vs  $2"; $H compare traces/$1 traces/$2 --brief || true; }
          # inside one runtime: serial against parallel, and two parallel runs
          cmp linux-net10-parallel linux-net10-parallel2
          cmp linux-net10-parallel linux-net10-serial
          cmp windows-net48-parallel windows-net48-parallel2
          cmp windows-net48-parallel windows-net48-serial
          cmp windows-net10-parallel windows-net10-serial
          # across runtimes and platforms
          cmp windows-net10-serial windows-net48-serial
          cmp windows-net10-parallel windows-net48-parallel
          cmp linux-net10-serial windows-net10-serial
          cmp linux-net10-serial windows-net48-serial
          # processor counts, and 32-bit
          for n in 1 2 3 8; do cmp linux-net10-serial linux-net10-cpu$n; done
          cmp windows-net48-serial windows-net48x86-serial
          # JIT and CPU-feature switches against the plain run of the same machine
          for k in nohw noavx2 notiered minopts; do cmp linux-net10-serial linux-net10-jit-$k; done
          for k in nohw notiered; do cmp windows-net10-serial windows-net10-jit-$k; done
          # arm64 (Linux; macOS only when it was run) against x64, and inside arm64
          for a in linux-arm64 windows-arm64 macos-arm64 macos-x64; do
            if [ ! -d traces/$a-net10-serial ]; then echo "$a skipped (not run)"; continue; fi
            cmp $a-net10-parallel $a-net10-parallel2
            cmp $a-net10-parallel $a-net10-serial
            for n in 1 3; do cmp $a-net10-serial $a-net10-cpu$n; done
            for k in nohw notiered; do cmp $a-net10-serial $a-net10-jit-$k; done
            cmp linux-net10-serial $a-net10-serial
            cmp windows-net48-serial $a-net10-serial
          done
          # Windows arm64: its .NET (the Windows C runtime again, on another architecture) and .NET Framework as an emulated x64 process
          if [ -d traces/windows-arm64-net10-serial ]; then cmp windows-net10-serial windows-arm64-net10-serial; fi
          if [ -d traces/windows-arm64-net48-serial ]; then
            cmp windows-arm64-net48-parallel windows-arm64-net48-serial
            cmp windows-net48-serial windows-arm64-net48-serial
            cmp windows-arm64-net10-serial windows-arm64-net48-serial
          fi
          if [ -d traces/macos-x64-net10-serial ] && [ -d traces/macos-arm64-net10-serial ]; then cmp macos-arm64-net10-serial macos-x64-net10-serial; fi
          if [ -d traces/macos-arm64-net10-serial ]; then cmp linux-arm64-net10-serial macos-arm64-net10-serial; fi
          for d in traces/*/; do echo "--- $d"; head -7 "$d/summary.txt"; done
      # one row per group of cases and pair of configurations (the table of docs/research/DETERMINISM_CROSS_RUNTIME_2026-11.md)
      - name: Cross-runtime matrix
        run: |
          python3 -m unittest discover -s tools/DeterminismHarness -p 'test_cross_matrix.py'
          python3 tools/DeterminismHarness/cross_matrix.py traces
      # the table of DETERMINISM_PROOF.md 5.3 (the exact kernel, its allow list, the rounding Booleans and the probes behind them)
      - name: Measurement rows
        run: |
          python3 -m unittest discover -s tools/DeterminismHarness -p 'test_measurement_rows.py'
          python3 tools/DeterminismHarness/measurement_rows.py traces
      # which part of a result differs (the label of the first differing value and the count per label), for the documented
      # operations and the winding numbers, on the pairs that separate runtime, operating system and architecture
      - name: Differing parts of the documented operations
        run: |
          H="dotnet tools/DeterminismHarness/bin/Release/net10.0/DeterminismHarness.dll"
          detail() {
            if [ ! -d traces/$1 ] || [ ! -d traces/$2 ]; then return; fi
            echo "=== $1  vs  $2"
            $H compare traces/$1 traces/$2 --brief | grep -E '^(examples|winding|param|probe\.libm-constfold|probe\.round-remainder)' | cut -c1-400 || true
          }
          detail windows-net10-serial windows-net48-serial
          detail linux-net10-serial windows-net10-serial
          detail linux-net10-serial macos-arm64-net10-serial
          detail windows-net10-serial windows-arm64-net10-serial

  # Opt-in (workflow_dispatch input `suite`): the PR-tier tests on linux arm64. The suite runs on linux x64 (net10.0) and
  # Windows (net48) in ci.yml; this run shows which of its pinned values (hashes, fingerprints, golden rows) hold on a
  # second architecture (docs/research/DETERMINISM_CROSS_RUNTIME_2026-11.md section 6).
  suite-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.suite
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: uname -m
      - run: dotnet test tests/geometry3Sharp.Tests -c Release -f net10.0 --filter "Category!=Slow&Category!=Nightly" --logger "trx;LogFileName=arm64.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-arm64
          path: test-results
