name: Thingi10K pairs (full runs)

# The full runs of the thingi-pairs classes of benchmarks/BooleanComparison (README.md, "Thingi10K pairs after the EMBER protocol",
# "Full runs"): 1000 pairs (thingi-pairs/pairs.csv) and the size class of 100k-1M triangles (pairs_size.csv), all three operations,
# ours and manifold; CGAL EPECK only on the fixed 100-pair sample (pairs_cgal_sample.csv). Manual only (workflow_dispatch, no
# schedule): the jobs fetch the Thingi10K models from huggingface at run time, which a PR-tier test never does. The library and the
# benchmark tool come from library_ref (the baseline run: the #418 merge commit 7cb08f69, the final run: master); the scripts
# (compare.py, data/thingi_pairs_runs.py) from the ref the workflow runs on. Methods: ours, manifold (the Python package manifold3d,
# Apache-2.0) and CGAL EPECK, each as a black box on a GitHub-hosted runner (cgal_bool.cpp, the repo's own driver, is built
# against the runner's libcgal-dev; GPL, the binary is not distributed; no CGAL source is read or ported). One job per shard of
# pairs, one process per boolean, -j 1. Raw rows (no mesh) go to the data branch runs/thingi-pairs, directory run-<run id>-<label>.
on:
  workflow_dispatch:
    inputs:
      library_ref:
        description: 'Ref of the library and benchmark tool to measure (must contain the thingi-pair, run and eval commands of BooleanComparison; the scripts come from the ref the workflow is run on)'
        default: 'master'
      label:
        description: 'Name of the run in the data branch, eg baseline or final'
        default: 'final'
      shard:
        description: 'Pairs of pairs.csv per job (1000 pairs)'
        default: '50'
      size_shard:
        description: 'Pairs of pairs_size.csv per job (100 pairs)'
        default: '10'
      cgal_shard:
        description: 'Pairs of pairs_cgal_sample.csv per job (100 pairs)'
        default: '20'
      timeout_s:
        description: 'Timeout per boolean in seconds (pairs.csv and the CGAL sample)'
        default: '300'
      size_timeout_s:
        description: 'Timeout per boolean in seconds for the size class (README.md: 900)'
        default: '900'
      methods:
        description: 'Methods: ours, manifold, cgal_epeck (cgal_epeck runs only on the CGAL sample)'
        type: choice
        options: ['ours,manifold,cgal_epeck', 'ours,manifold', 'ours', 'cgal_epeck']
        default: 'ours,manifold,cgal_epeck'
      classes:
        description: 'Which lists: normal (pairs.csv), size (pairs_size.csv), cgal (pairs_cgal_sample.csv)'
        default: 'normal,size,cgal'
      max_pairs:
        description: 'Only the first N pairs of each list (0: all; for a smoke run)'
        default: '0'

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'harmengrossedeters/geometry3Sharp'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          SHARD: ${{ inputs.shard }}
          SIZE_SHARD: ${{ inputs.size_shard }}
          CGAL_SHARD: ${{ inputs.cgal_shard }}
          METHODS: ${{ inputs.methods }}
          CLASSES: ${{ inputs.classes }}
          MAX_PAIRS: ${{ inputs.max_pairs }}
          LABEL: ${{ inputs.label }}
        run: |
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "label: letters, digits, . _ - only"; exit 1; }
          m=$(python3 benchmarks/BooleanComparison/data/thingi_pairs_runs.py plan --shard "$SHARD" --size-shard "$SIZE_SHARD" --cgal-shard "$CGAL_SHARD" --methods "$METHODS" --classes "$CLASSES" --max-pairs "$MAX_PAIRS")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -c 'import json,sys; j=json.load(sys.stdin)["include"]; print(len(j), "jobs")' | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(echo "$m" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" -gt 0 ] || { echo "no job"; exit 1; }

  measure:
    needs: plan
    runs-on: ubuntu-latest   # GitHub-hosted only, never self-hosted
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.library_ref }}
          path: lib
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: scripts
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build cgal_bool (CGAL from apt, used as a black box)
        if: ${{ contains(matrix.methods, 'cgal_epeck') }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcgal-dev libgmp-dev libmpfr-dev
          g++ -O2 -std=c++17 -DNDEBUG -DCGAL_NDEBUG lib/benchmarks/BooleanComparison/external/cgal_bool.cpp -o cgal_bool -lgmp -lmpfr
          dpkg -s libcgal-dev | grep '^Version'
      - name: Install manifold3d
        if: ${{ contains(matrix.methods, 'manifold') }}
        run: |
          python3 -m pip install numpy manifold3d==3.0.1
          python3 -m pip show manifold3d | grep '^Version'
      - name: Build the benchmark tool
        run: |
          dotnet build lib/benchmarks/BooleanComparison/BooleanComparison.csproj -c Release
          cp -r lib/benchmarks/BooleanComparison/bin/Release/net10.0 frozen
          git -C lib rev-parse HEAD > lib_sha.txt
          git -C scripts rev-parse HEAD >> lib_sha.txt
          nproc >> lib_sha.txt
          if [ -x cgal_bool ]; then dpkg -s libcgal-dev | grep '^Version' >> lib_sha.txt; fi
          if python3 -m pip show manifold3d > /dev/null 2>&1; then python3 -m pip show manifold3d | grep '^Version' >> lib_sha.txt; fi
          # the commands the run calls must exist in the tool of the ref under test
          for c in thingi-pair run eval; do grep -q "case \"$c\"" lib/benchmarks/BooleanComparison/Program.cs || { echo "library_ref has no command $c"; exit 1; }; done
      - name: Pair list of the shard and its models
        env:
          KIND: ${{ matrix.kind }}
          LO: ${{ matrix.lo }}
          HI: ${{ matrix.hi }}
        run: |
          S=scripts/benchmarks/BooleanComparison
          if [ "$KIND" = size ]; then P=pairs_shard_size.csv; else P=pairs_shard.csv; fi
          python3 $S/data/thingi_pairs_runs.py shard "$KIND" "$LO" "$HI" "$P"
          python3 $S/data/thingi_pairs_runs.py fetch data "$P"
          python3 $S/data/thingi_pairs.py manifest "$P" data cases.jsonl
      - name: Run the methods
        env:
          CGAL_BOOL: ${{ github.workspace }}/cgal_bool
          BOOLCMP_TOOL: ${{ github.workspace }}/frozen/BooleanComparison.dll
          TIMEOUT: ${{ matrix.kind == 'size' && inputs.size_timeout_s || inputs.timeout_s }}
          METHODS: ${{ matrix.methods }}
          JOB: ${{ matrix.id }}
        run: |
          python3 scripts/benchmarks/BooleanComparison/compare.py cases.jsonl "results-$JOB.jsonl" --methods "$METHODS" --timeout "$TIMEOUT" -j 1 --resume
      - name: Report
        if: always()
        env:
          JOB: ${{ matrix.id }}
        run: |
          [ -f "results-$JOB.jsonl" ] || { echo "no results (an earlier step failed)"; exit 0; }
          python3 scripts/benchmarks/BooleanComparison/data/thingi_pairs_runs.py summary "results-$JOB.jsonl" | tee "report-$JOB.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pairs-${{ matrix.id }}
          path: |
            results-${{ matrix.id }}.jsonl
            report-${{ matrix.id }}.md
            lib_sha.txt

  publish:
    needs: measure
    if: ${{ !cancelled() && github.repository == 'harmengrossedeters/geometry3Sharp' }}
    runs-on: ubuntu-latest
    concurrency:
      group: thingi-pairs-data-branch
      cancel-in-progress: false
    permissions:
      contents: write   # the data branch runs/thingi-pairs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true      # the measure jobs may have failed before they uploaded anything
        with:
          path: art
      - name: Table of the whole run
        run: |
          set -o pipefail
          python3 benchmarks/BooleanComparison/data/thingi_pairs_runs.py summary art | tee table.md >> "$GITHUB_STEP_SUMMARY"
      - name: Raw rows to runs/thingi-pairs
        env:
          LABEL: ${{ inputs.label }}
          LIB_REF: ${{ inputs.library_ref }}
        run: |
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "label: letters, digits, . _ - only"; exit 1; }
          d=$(mktemp -d)
          git worktree add -q --detach "$d"
          cp table.md "$RUNNER_TEMP/table.md"
          cd "$d"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin runs/thingi-pairs > /dev/null; then
            git fetch -q --depth=1 origin runs/thingi-pairs:refs/remotes/origin/runs/thingi-pairs
            git checkout -q -B runs/thingi-pairs origin/runs/thingi-pairs
          else
            git checkout -q --orphan runs/thingi-pairs
            git rm -rqf .
          fi
          r="run-$GITHUB_RUN_ID-$LABEL"
          mkdir -p "$r"
          for a in "$GITHUB_WORKSPACE"/art/pairs-*; do mkdir -p "$r/$(basename "$a")" && cp "$a"/* "$r/$(basename "$a")/"; done
          cp "$RUNNER_TEMP/table.md" "$r/table.md"
          echo "library_ref $LIB_REF" > "$r/run.txt"
          git add .
          git diff --cached --quiet && exit 0
          git commit -q -m "Thingi10K pairs run $GITHUB_RUN_ID ($LABEL)"
          git push origin runs/thingi-pairs
