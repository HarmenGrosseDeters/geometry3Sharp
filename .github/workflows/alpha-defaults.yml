name: Scale-free repair study, F1 A/B (runs/scale-free-f1 only)

# This file replaces alpha-defaults.yml on the data branch runs/scale-free-study only (the dispatch needs a workflow file of that
# name on master; a run dispatched on this branch uses this content). It is never merged. Hard problem 9 study: MeshRobustRepair in
# the configurations of benchmarks/MeshRepairBenchmark/scale_free_study.py over the first and the holdout selection (800 meshes,
# cases/scale_free_list800.tsv). Each shard fetches only its own Thingi10K models at run time; no mesh is committed. GitHub-hosted
# runners only. Results (raw rows, summary) are pushed to runs/scale-free-study under results/run-<run id>.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of shards (1 to 64)'
        default: '24'
      configs:
        description: 'Configurations (R first; letters of RPQSLGT)'
        default: 'RN'
      ids:
        description: 'Space-separated mesh ids (empty: the whole list)'
        default: ''
      timeout_s:
        description: 'Timeout per mesh and configuration in seconds'
        default: '600'

permissions:
  contents: read

concurrency:
  group: scale-free-study
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'harmengrossedeters/geometry3Sharp'
    runs-on: ubuntu-latest   # GitHub-hosted only, never self-hosted
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
          CONFIGS: ${{ inputs.configs }}
          IDS: ${{ inputs.ids }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          e = os.environ
          if not re.fullmatch(r"[1-9][0-9]?", e["SHARDS"]) or not 1 <= int(e["SHARDS"]) <= 64:
              sys.exit("shards must be 1 to 64")
          if not re.fullmatch(r"R[PQSLGTN]{0,7}", e["CONFIGS"]) or len(set(e["CONFIGS"])) != len(e["CONFIGS"]):
              sys.exit("configs must start with R, distinct letters of RPQSLGT")
          if not re.fullmatch(r"[0-9 ]*", e["IDS"]):
              sys.exit("ids must be numbers separated by spaces")
          if not re.fullmatch(r"[0-9]{2,3}", e["TIMEOUT_S"]) or not 30 <= int(e["TIMEOUT_S"]) <= 900:
              sys.exit("timeout_s must be 30 to 900 seconds")
          with open(e["GITHUB_OUTPUT"], "a") as f:
              f.write("shards=" + json.dumps(list(range(int(e["SHARDS"])))) + "\n")
          PY

  measure:
    needs: plan
    runs-on: ubuntu-latest   # GitHub-hosted only, never self-hosted
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the benchmark
        run: |
          dotnet build benchmarks/MeshRepairBenchmark/MeshRepairBenchmark.csproj -c Release
          { git rev-parse HEAD; nproc; dotnet --version; } > lib_sha.txt
      - name: Select and fetch the shard's meshes
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          IDS: ${{ inputs.ids }}
        run: |
          cd benchmarks/MeshRepairBenchmark
          LIST=cases/scale_free_list800.tsv
          if [ -n "${IDS// /}" ]; then printf '%s\tids\tids\n' $IDS > "$RUNNER_TEMP/list.tsv"; LIST="$RUNNER_TEMP/list.tsv"; fi
          python3 scale_free_study.py select "$LIST" "$SHARD" "$SHARDS" > "$RUNNER_TEMP/ids.txt"
          wc -l < "$RUNNER_TEMP/ids.txt"
          [ -s "$RUNNER_TEMP/ids.txt" ] || exit 0
          python3 fetch_data.py --ids "$RUNNER_TEMP/ids.txt"
      - name: Run the configurations
        env:
          CONFIGS: ${{ inputs.configs }}
          TIMEOUT_S: ${{ inputs.timeout_s }}
        run: |
          [ -s "$RUNNER_TEMP/ids.txt" ] || { echo "empty shard"; exit 0; }
          python3 benchmarks/MeshRepairBenchmark/scale_free_study.py run "$RUNNER_TEMP/ids.txt" "$GITHUB_WORKSPACE/out" \
            --configs "$CONFIGS" --timeout "$TIMEOUT_S" --deadline-min "$((320 - ${#CONFIGS} * TIMEOUT_S / 60))"
      - name: Shard summary
        if: always()
        run: |
          echo "### Shard ${{ matrix.shard }}: meshes $(wc -l < "$RUNNER_TEMP/ids.txt"), rows $(cat out/raw/*.jsonl 2>/dev/null | wc -l), wall $(awk '{s+=$3} END {print s+0}' out/wall.tsv 2>/dev/null) s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            out/
            lib_sha.txt

  publish:
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.repository == 'harmengrossedeters/geometry3Sharp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # results on runs/scale-free-study
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: shard-*
      - name: Merge and summarize
        run: |
          B=benchmarks/MeshRepairBenchmark
          ls -d art/shard-*/out > /dev/null
          python3 $B/scale_free_study.py merge merged art/shard-*/out
          cp art/shard-0/lib_sha.txt merged/lib_sha.txt 2>/dev/null || true
          { python3 -I $B/scale_free_study.py f1 merged; echo; python3 -I $B/scale_free_study.py analyze merged $B/cases/scale_free_list800.tsv; } > merged/summary.md || echo "summary failed (see log)" > merged/summary.md
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: merged
          path: merged/
      - name: Raw rows and summary to runs/scale-free-study
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp -r merged "$RUNNER_TEMP/merged"
          git clone -q --depth=1 --branch runs/scale-free-f1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$d"
          cd "$d"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p "results/run-$GITHUB_RUN_ID"
          cp -r "$RUNNER_TEMP"/merged/. "results/run-$GITHUB_RUN_ID"/
          git add results
          git diff --cached --quiet && exit 0
          git commit -q -m "scale-free study: run $GITHUB_RUN_ID (raw rows and summary)"
          for i in 1 2 3 4; do git push -q origin HEAD:runs/scale-free-f1 && exit 0; sleep $((i * 10)); git pull -q --rebase origin runs/scale-free-f1; done
          exit 1
