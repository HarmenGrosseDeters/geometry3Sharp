name: New tests on base

# Runs the test methods a PR adds against the library of its base branch (docs/QA.md 4a item 1,
# tools/new_tests_on_base.py). Informational (a summary in the job log and the step summary), except for PRs with
# the label `bugfix`: then at least one new test must fail on the base.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# a new push or label change replaces the run under way
concurrency:
  group: new-tests-on-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  new-tests-on-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # the PR head itself (not the merge commit) and the history back to the merge base
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # the script from the merge commit, else the head, else the base: a branch made before the script was added has
      # no copy of it at its head
      - name: The script
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/merge:refs/new-tests-on-base/merge" || true
          for ref in refs/new-tests-on-base/merge "$HEAD_SHA" "$BASE_SHA"; do
            if git cat-file -e "$ref:tools/new_tests_on_base.py" 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/script"
              for f in new_tests_on_base.py test_new_tests_on_base.py; do
                git show "$ref:tools/$f" > "$RUNNER_TEMP/script/$f"
              done
              echo "script from $ref"
              exit 0
            fi
          done
          echo "::error::tools/new_tests_on_base.py is in none of the merge commit, the head and the base"
          exit 1
      - name: Unit tests of the script
        run: python3 -m unittest discover -s "$RUNNER_TEMP/script" -p 'test_new_tests_on_base.py'
      - name: Run the new tests against the base library
        env:
          # On the old library a new test may run away with memory. With this limit it fails, instead of the runner being killed.
          DOTNET_GCHeapHardLimit: "0x100000000"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUIRE_FAILING: ${{ contains(github.event.pull_request.labels.*.name, 'bugfix') && '--require-failing' || '' }}
        run: python3 "$RUNNER_TEMP/script/new_tests_on_base.py" --base "$BASE_SHA" --work "$RUNNER_TEMP/new-tests-on-base" --summary "$GITHUB_STEP_SUMMARY" $REQUIRE_FAILING
