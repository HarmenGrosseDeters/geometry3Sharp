name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # net10.0 build of the library, all tests, NuGet package and package smoke test
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build geometry3Sharp_netstandard.csproj -c Release
      - name: Test (net10.0)
        run: dotnet test tests/geometry3Sharp.Tests -c Release --logger "trx;LogFileName=net10.trx" --results-directory test-results
      - name: Test CLI / MCP server (tools/g3cli)
        run: dotnet test tests/g3cli.Tests -c Release --logger "trx;LogFileName=g3cli.trx" --results-directory test-results
      - name: Pack
        run: dotnet pack geometry3Sharp_netstandard.csproj -c Release -o artifacts -p:Version=1.0.0-ci.${{ github.run_number }}
      - name: Package smoke test
        run: >
          dotnet run --project tests/PackageSmokeTest -c Release
          -p:G3PackageVersion=1.0.0-ci.${{ github.run_number }} -p:G3PackageSource=${{ github.workspace }}/artifacts
          -- artifacts/geometry3Sharp.1.0.0-ci.${{ github.run_number }}.nupkg
      - name: Build the benchmarks
        run: for p in benchmarks/*/*.csproj; do dotnet build "$p" -c Release -f net10.0 || exit 1; done
      - name: Acceptance gates of the 2D mesher (oracle self-check, differential against NetTopologySuite, golden rows)
        run: dotnet run --project benchmarks/Meshing2Benchmark -c Release -f net10.0 --no-build -- ci
      - name: A changed golden row of the 2D mesher states a reason
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          for f in benchmarks/Meshing2Benchmark/golden/*.json; do
            git show "FETCH_HEAD:$f" > golden-base.json 2>/dev/null || echo '{"format": 1, "rows": [], "removed": []}' > golden-base.json
            dotnet run --project benchmarks/Meshing2Benchmark -c Release -f net10.0 --no-build -- golden verify-changes --base golden-base.json --current "$f" || exit 1
          done
      - name: Test the benchmark analysis
        run: python3 benchmarks/MeshRepairBenchmark/test_analysis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: |
            artifacts/
            test-results/

  # net48 test run, which uses the netstandard2.0 build of the library
  netstandard:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test (net48 / netstandard2.0)
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net48 --logger "trx;LogFileName=net48.trx" --results-directory test-results
      - name: Benchmark reporting regression (MeshRepairBenchmark)
        shell: powershell
        run: benchmarks/MeshRepairBenchmark/test_validity_reporting.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netstandard-results
          path: test-results/
