name: CI

on:
  # Two stages on a pull request (owner 2026-11-23, runner load; docs/QA.md "Test tiers", docs/qa/ci-and-gates.md "Two-stage PR CI"):
  # every event of a ready PR runs the job `quick` (the builds and the net10.0 tests of the changed areas, a signal); the full
  # matrix (linux, netstandard a/b with net48, isolated, time-rule) runs only while the PR has the label `full-ci` (set by the
  # coordinator, like `bugfix`): the labeled event starts it on the current head, and every later push runs it on the new head.
  # The merge gate is the commit status `full-ci` (job full-ci-status): green only from a full run on the PR's head.
  # Master (owner 2026-11-23): no run per merge. A run every 2 hours (schedule) tests master's head if anything the library tests
  # read changed since the last tested head (tools/master_batch.py); a red batch is narrowed down with tools/master_bisect.py.
  # Tags and workflow_dispatch run the full matrix as before.
  # docs-only changes skip CI (CLAUDE.md, "Before every push"), except the design docs that a test checks: the bound
  # table (GeneratedPredicatesTests) and the stage 0 ledger of the determinism proof (DeterminismScopeAnalyzerTests). Branches other
  # than master run through their pull request only. A branch without a PR: workflow_dispatch.
  push:
    tags: ['**']
  # ready_for_review: marking a draft ready starts the quick stage. A draft gets no CI (the job scope below is the gate); on demand:
  # workflow_dispatch. labeled: setting `full-ci` starts the full stage. (Any other label set while `full-ci` is on re-runs it:
  # set `bugfix` and the like before `full-ci`. No unlabeled: removing a label starts nothing.)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['**', '!**/*.md', 'docs/design/FIXED_WIDTH_EXACT_POINTS.md', 'docs/design/DETERMINISM_PROOF.md']
  schedule:
    - cron: '41 */2 * * *'     # every 2 hours: the batched master run (skipped when there is nothing new to test)
  workflow_dispatch:

# A new push to the same PR (or branch) cancels the run under way. Master and manual runs are never cancelled: they queue (GitHub
# keeps the run under way and the newest pending one). A run that the gate of the job scope skips (an event of a draft) has its
# own group, so it cannot cancel a real run of the PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '-skipped' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Two tiers (docs/QA.md, "Test tiers"): the library tests of a draft PR skip the tests tagged [Trait("Category", "Slow")]
  # (5 s and more); a PR that is ready for review, master and manual runs run all of them.
  FULL_TIER: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

jobs:
  # Which parts of CI a run needs (tools/ci_scope.py): a PR that changes only tools, benchmarks or docs that the library
  # build and the test projects do not read skips the library test suites (net10.0, net48, Clipper2). The library build,
  # the API validation (pack), the smoke tests and the benchmark and tool steps of the full stage run always.
  # It is also the gate (owner 2026-11-15, runner load: most runs of draft PRs were cancelled by the next push): a draft PR gets no CI;
  # start one with workflow_dispatch (Actions tab, or `gh workflow run ci.yml --ref <branch>`; its checks attach to the head commit).
  # Every other job needs scope, so a skipped scope skips all of them (they report "skipped" on the draft only).
  # `full` says whether the full stage runs: on a PR the label `full-ci` (from the event: the labeled event carries the new label),
  # on a scheduled run tools/master_batch.py (skip when master's head, or everything the tests read, was already tested), on tags
  # and workflow_dispatch always. `quick` runs on a PR exactly when the full stage does not (the full stage covers it).
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # master_batch.py reads the earlier master runs and their jobs
    outputs:
      library: ${{ steps.scope.outputs.library }}
      g3cli: ${{ steps.scope.outputs.g3cli }}
      ps1: ${{ steps.scope.outputs.ps1 }}
      full: ${{ steps.full.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # (a scheduled run diffs master's head against the last tested head, which can be many merges back)
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '2' }}
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # the checkout is the merge commit of the PR into the base: its first parent is the base
            git diff --name-only --no-renames HEAD^1 HEAD | tee changed.txt
            python3 tools/ci_scope.py < changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            python3 tools/ci_scope.py --all | tee -a "$GITHUB_OUTPUT"
          fi
      - id: full
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$EVENT" in
            pull_request)
              echo "full=$FULL_LABEL" | tee -a "$GITHUB_OUTPUT"
              if [ "$FULL_LABEL" != true ]; then
                printf '### PR CI: quick stage\nThe full matrix runs with the label `full-ci` (the merge gate, commit status `full-ci`).\n' >> "$GITHUB_STEP_SUMMARY"
              fi ;;
            schedule)
              python3 tools/master_batch.py --repo "$REPO" --head "$HEAD_SHA" --run-id "$RUN_ID" --branch "$BRANCH" --summary "$GITHUB_STEP_SUMMARY" | tee -a "$GITHUB_OUTPUT" ;;
            *)
              echo "full=true" | tee -a "$GITHUB_OUTPUT" ;;
          esac

  # The quick stage of a ready PR (owner 2026-11-23): the builds that catch compile errors (the library for net10.0 and
  # netstandard2.0, the net10.0 test project) and the net10.0 tests of the changed areas without Slow and Nightly
  # (tools/ci_scope.py --quick: the changed test classes, the classes of the test files that use a changed type, a smoke set;
  # a broad change runs the smoke set and the directly named classes only, and says so in the summary). A signal, not the gate:
  # the full stage on the final head is. Target about 5 minutes. It does not run when the full stage runs (that covers it).
  quick:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: No mutation marker in the sources
        run: python3 tests/mutation/exclude_other_sources.py check --root .
      - name: Build the library (net10.0, netstandard2.0)
        run: dotnet build geometry3Sharp_netstandard.csproj -c Release
      - name: Build the tests (net10.0)
        if: needs.scope.outputs.library == 'true'
        run: dotnet build tests/geometry3Sharp.Tests -c Release -f net10.0
      - name: Which tests
        id: which
        if: needs.scope.outputs.library == 'true'
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          python3 tools/ci_scope.py --quick --summary "$GITHUB_STEP_SUMMARY" < changed.txt > which.txt
          sed -n 's/^broad=//p' which.txt
          sed -n 's/^filter=//p' which.txt > filter.txt
          echo "any=$([ -s filter.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Test the changed areas (net10.0)
        if: steps.which.outputs.any == 'true'
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net10.0 --no-build --filter "$(cat filter.txt)" --logger "trx;LogFileName=quick.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-results
          path: test-results/
          if-no-files-found: ignore

  # net10.0 build of the library, all tests, NuGet package and package smoke test
  linux:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: No mutation marker in the sources
        # (tests/mutation/exclude_other_sources.py marks the files a mutation shard does not mutate only while Stryker runs
        # and run_stryker.sh takes the marks off again; a marked file must never reach a commit, the build or the pack)
        run: python3 tests/mutation/exclude_other_sources.py check --root .
      - name: Build
        run: dotnet build geometry3Sharp_netstandard.csproj -c Release
      - name: Test (net10.0)
        if: needs.scope.outputs.library == 'true'
        run: |
          # (Category=Nightly runs in .github/workflows/nightly.yml only)
          filter=(--filter "Category!=Nightly")
          if [ "$FULL_TIER" != true ]; then filter=(--filter "Category!=Slow&Category!=Nightly"); fi
          dotnet test tests/geometry3Sharp.Tests -c Release "${filter[@]}" --logger "trx;LogFileName=net10.trx" --results-directory test-results
      # the full run's trx, for the job time-rule (the 5 s / 10 s rule is judged on the time alone, see the job isolated)
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.full == 'true' && needs.scope.outputs.library == 'true' && env.FULL_TIER == 'true'
        with:
          name: full-run-trx
          path: test-results/net10.trx
          if-no-files-found: ignore
      - name: Test CLI / MCP server (tools/g3cli)
        if: needs.scope.outputs.g3cli == 'true'
        run: dotnet test tests/g3cli.Tests -c Release --logger "trx;LogFileName=g3cli.trx" --results-directory test-results
      - name: Test the Clipper2 package (addons/geometry3Sharp.Clipper2)
        if: needs.scope.outputs.library == 'true'
        run: dotnet test tests/geometry3Sharp.Clipper2.Tests -c Release --logger "trx;LogFileName=clipper2.trx" --results-directory test-results
      - name: Pack
        run: dotnet pack geometry3Sharp_netstandard.csproj -c Release -o artifacts -p:Version=1.0.0-ci.${{ github.run_number }}
      - name: Pack the Clipper2 package
        run: dotnet pack addons/geometry3Sharp.Clipper2/geometry3Sharp.Clipper2.csproj -c Release -o artifacts -p:Version=1.0.0-ci.${{ github.run_number }}
      - name: Package smoke test
        run: >
          dotnet run --project tests/PackageSmokeTest -c Release
          -p:G3PackageVersion=1.0.0-ci.${{ github.run_number }} -p:G3PackageSource=${{ github.workspace }}/artifacts
          -- artifacts/geometry3Sharp.1.0.0-ci.${{ github.run_number }}.nupkg
      - name: Clipper2 package smoke test
        run: >
          dotnet run --project tests/Clipper2PackageSmokeTest -c Release
          -p:G3PackageVersion=1.0.0-ci.${{ github.run_number }} -p:G3PackageSource=${{ github.workspace }}/artifacts
          -- artifacts/geometry3Sharp.Clipper2.1.0.0-ci.${{ github.run_number }}.nupkg
      - name: Test the reader fuzz harness (without a fuzz campaign)
        run: |
          dotnet build tools/ReaderFuzzPilot -c Release
          READER_FUZZ_DLL="$PWD/tools/ReaderFuzzPilot/bin/Release/net10.0/ReaderFuzzPilot.dll" DOTNET_HOST_PATH="$(command -v dotnet)" python3 -m unittest discover -s tools/ReaderFuzzPilot -p 'test_*.py' -v
      - name: Test the mesh-operation fuzz harness (without a fuzz campaign)
        run: |
          dotnet build tools/MeshFuzzPilot -c Release
          MESH_FUZZ_DLL="$PWD/tools/MeshFuzzPilot/bin/Release/net10.0/MeshFuzzPilot.dll" DOTNET_HOST_PATH="$(command -v dotnet)" python3 -m unittest discover -s tools/MeshFuzzPilot -p 'test_*.py' -v
      - name: Build the benchmarks, the predicate compiler and the adversarial run of the error bound audit
        run: for p in benchmarks/*/*.csproj tools/PredicateCompiler/*.csproj tools/ErrorBoundAudit/Adversarial/*.csproj; do dotnet build "$p" -c Release -f net10.0 || exit 1; done
      - name: Error bound audit (the derivations with their source anchors; the library's filters against ExactDyadic)
        run: |
          python3 -m unittest discover -s tools/ErrorBoundAudit -p 'test_*.py' -v
          dotnet run --project tools/ErrorBoundAudit/Adversarial -c Release -f net10.0 --no-build -- 2000 1
      - name: Acceptance gates of the 2D mesher (oracle self-check, differential against NetTopologySuite, golden rows)
        run: dotnet run --project benchmarks/Meshing2Benchmark -c Release -f net10.0 --no-build -- ci
      - name: A changed golden row of the 2D mesher states a reason
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          # the files of both sides: a deleted file counts as one with all rows removed
          files=$( (ls benchmarks/Meshing2Benchmark/golden/*.json; git ls-tree --name-only FETCH_HEAD benchmarks/Meshing2Benchmark/golden/) | sort -u)
          for f in $files; do
            git show "FETCH_HEAD:$f" > golden-base.json 2>/dev/null || echo '{"format": 1, "rows": [], "removed": []}' > golden-base.json
            if [ -f "$f" ]; then cp "$f" golden-current.json; else echo '{"format": 1, "rows": [], "removed": []}' > golden-current.json; fi
            dotnet run --project benchmarks/Meshing2Benchmark -c Release -f net10.0 --no-build -- golden verify-changes --base golden-base.json --current golden-current.json || exit 1
          done
      - name: Test the CI scripts (tools/ci_scope.py, tools/master_batch.py, tools/master_bisect.py, tools/trx_durations.py, tools/changed_line_coverage.py, tools/runtime_watch.py, tools/schedule_guard.py, tools/blame_summary.py, tools/gate_check.py, tools/review_triggers.py, tools/check_docs.py)
        run: |
          python3 -m unittest discover -s tools -p 'test_ci_scope.py' -v
          python3 -m unittest discover -s tools -p 'test_master_batch.py' -v
          python3 -m unittest discover -s tools -p 'test_trx_durations.py' -v
          python3 -m unittest discover -s tools -p 'test_changed_line_coverage.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_watch.py' -v
          python3 -m unittest discover -s tools -p 'test_schedule_guard.py' -v
          python3 -m unittest discover -s tools -p 'test_blame_summary.py' -v
          python3 -m unittest discover -s tools -p 'test_gate_check.py' -v
          python3 -m unittest discover -s tools -p 'test_review_triggers.py' -v
          python3 -m unittest discover -s tools -p 'test_check_docs.py' -v
          python3 tools/check_docs.py
      - name: Test the benchmark analysis
        run: |
          python3 benchmarks/MeshRepairBenchmark/test_analysis.py
          python3 -m unittest discover -s benchmarks/UVAtlasBenchmark -p 'test_compare_report.py' -v
          python3 benchmarks/MeshRepairBenchmark/test_alpha_defaults.py
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_thingi_pairs.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_thingi_pairs_runs.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_thingi_contact.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_thingi_imprint.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_abc_chained.py' -v
          python3 -m unittest discover -s benchmarks/net48-compare -p 'test_report.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_t6.py' -v
          python3 -m unittest discover -s benchmarks/BooleanComparison -p 'test_geogram.py' -v
          python3 -m unittest discover -s tools/FPTaylorPilot -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/OracleSourcePilot -p 'test_*.py' -v
          python3 -m unittest discover -s benchmarks/Meshing2Benchmark/corpus -p 'test_*.py' -v
          TERRAIN_BENCHMARK_DLL="$PWD/benchmarks/TerrainBenchmark/bin/Release/net10.0/TerrainBenchmark.dll" python3 -m unittest discover -s benchmarks/TerrainBenchmark -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: |
            artifacts/
            test-results/

  # net48 test run, which uses the netstandard2.0 build of the library. It runs in two shards with complementary
  # filters (every test exactly once): the net48 run took 40-60 min in one job and hit timeout-minutes; the 2D mesher
  # and envelope tests are about half of its time (net10.0 timings, 2026-11-04). The first shard keeps the check name
  # `netstandard` and runs the Clipper2 and benchmark steps too. The envelope tests moved to shard b on 2026-11-04
  # (shard a had grown to 40 min with the mesher tests, shard b was at 20-26 min).
  # The time rule of CLAUDE.md ("Test time") is judged on the time of a test alone: in a full run the test classes and the
  # library's parallel loops compete for the cores, so a test takes several times its time alone (docs/QA.md, "Judged
  # alone"). This job runs the tests that can be above the rule, the tests tagged Slow and the methods of SLOW_BACKLOG.txt, one
  # class after the other, in parallel to the job linux (it needs no result of it). The job time-rule judges.
  isolated:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.library == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the tests
        run: dotnet build tests/geometry3Sharp.Tests -c Release -f net10.0
      - name: Which tests
        id: which
        run: |
          dotnet test tests/geometry3Sharp.Tests -c Release -f net10.0 --no-build --list-tests --filter "Category=Slow" > slow-tests.txt
          python3 tools/trx_durations.py --rerun-filter rerun.txt --slow-list slow-tests.txt --backlog tests/geometry3Sharp.Tests/SLOW_BACKLOG.txt
          if [ ! -s rerun.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::no test to run alone (the Slow list and the backlog are empty or the listing failed)"
            printf '### Test time rule\nNo test to run alone: the list of Slow-tagged tests and the backlog gave an empty filter.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run them alone (one test class at a time)
        if: steps.which.outputs.skip != 'true'
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net10.0 --no-build --filter "Category!=Nightly&($(cat rerun.txt))" --logger "trx;LogFileName=alone.trx" --results-directory test-results -- xUnit.ParallelizeTestCollections=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-results
          path: |
            test-results/alone.trx
            slow-tests.txt
          if-no-files-found: ignore

  # The rule itself (CLAUDE.md, "Test time"): judged on the time alone from the job isolated; a test above 20 s in the full run
  # is listed as a potential defect (an issue with a diagnosis, owner 2026-11-12). Fails for a test of more than 10 s
  # alone, and for one of 5 s or more alone without the trait Slow, unless its method is on
  # tests/geometry3Sharp.Tests/SLOW_BACKLOG.txt; that list may only shrink (a PR may not add to the base branch's list).
  time-rule:
    needs: [scope, linux, isolated]
    if: always() && needs.scope.outputs.full == 'true' && needs.scope.outputs.library == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.linux.result != 'skipped' && needs.isolated.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # RATCHET_ENFORCE=0: report mode (violations go to the step summary and as warnings, the job passes) until the backlog is
      # remade from the isolated times (SLOW_BACKLOG.txt) and this job has been green on master; then it is set to 1.
      RATCHET_ENFORCE: '0'
    steps:
      - uses: actions/checkout@v4
      # (the inputs may be missing: linux failed before its trx, isolated timed out or crashed; the script below says so in the
      # step summary and, in report mode, passes)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-run-trx
          path: full
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: isolated-results
          path: alone
      - name: Judge
        run: |
          note() { printf '### Test time rule\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; echo "::warning::$1"; }
          missing() { if [ "$RATCHET_ENFORCE" = 1 ]; then exit 1; else exit 0; fi; }
          if [ ! -f full/net10.trx ]; then
            note "net10.trx is missing (the job linux failed before its trx): the time rule was not judged."
            missing
          fi
          iso=(); slow=()
          if [ -f alone/test-results/alone.trx ]; then iso=(--isolated alone/test-results/alone.trx)
          else note "alone.trx is missing (the job isolated timed out, crashed or had nothing to run): the tests are judged on their full-run times."; fi
          if [ -f alone/slow-tests.txt ]; then slow=(--slow-list alone/slow-tests.txt)
          else note "slow-tests.txt is missing: the Slow tags are not known, untagged tests of 5 s or more are reported without them."; fi
          base=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            if git show FETCH_HEAD:tests/geometry3Sharp.Tests/SLOW_BACKLOG.txt > backlog-base.txt 2>/dev/null; then base=(--backlog-base backlog-base.txt); fi
          fi
          python3 tools/trx_durations.py full/net10.trx "${iso[@]}" "${slow[@]}" --threshold 5 --backlog tests/geometry3Sharp.Tests/SLOW_BACKLOG.txt "${base[@]}" $([ "$RATCHET_ENFORCE" = 1 ] || echo --report-only) --summary "$GITHUB_STEP_SUMMARY"

  netstandard:
    name: ${{ matrix.name }}
    needs: scope
    # not on a draft PR (like isolated), and on a ready PR only in the full stage (label full-ci): the merge gate is the status
    # full-ci (job full-ci-status), so a skipped check of these names never stands for a passed one.
    if: needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: netstandard
            shard: a
            filter: (FullyQualifiedName~Mesh2|FullyQualifiedName~Meshing2|FullyQualifiedName~Terrain|FullyQualifiedName~PointCloudSurfaceTests|FullyQualifiedName~RemesherSelfIntersectionTests|FullyQualifiedName~MeshFidelityMetricsTests|FullyQualifiedName~RoundingExactPairsTests|FullyQualifiedName~MeshRobustRepairTests|FullyQualifiedName~AlphaWrapQualityPassTests|FullyQualifiedName~RemeshSizingTests|FullyQualifiedName~TpmsLatticeTests|FullyQualifiedName~MeshRoundingRepairIncrementalTests)
          - name: netstandard-b
            shard: b
            filter: (FullyQualifiedName!~Mesh2&FullyQualifiedName!~Meshing2&FullyQualifiedName!~Terrain&FullyQualifiedName!~PointCloudSurfaceTests&FullyQualifiedName!~RemesherSelfIntersectionTests&FullyQualifiedName!~MeshFidelityMetricsTests&FullyQualifiedName!~RoundingExactPairsTests&FullyQualifiedName!~MeshRobustRepairTests&FullyQualifiedName!~AlphaWrapQualityPassTests&FullyQualifiedName!~RemeshSizingTests&FullyQualifiedName!~TpmsLatticeTests&FullyQualifiedName!~MeshRoundingRepairIncrementalTests)
    # (2026-11-15, net10.0 summed durations of a full run after the Meshing2 self-check fix: a 1720 s, b 2462 s; the three classes after
    # Terrain moved from b to a to balance the summed time. Shard b is the exact complement of a, so every test runs once. Before the fix
    # a/b were 1912/2668 s; the Windows jobs took 28 and 31 min. The first split measured on net48 (PR #954): the test step took 682 s in
    # a (1720 net10 s) and 1438 s in b (2462 net10 s), so net48 costs about 0.40 s per net10 second in a and 0.58 in b; six more classes
    # (about 270 net10 s) moved from b to a.)
    # (2026-11-09: the terrain tests moved to shard a; the mesher tests got cheaper (sparse tag check), shard a was at 14 min and
    # shard b at 32. Summed net10.0 durations of the full run: a 2050 s, b 2113 s.)
    # (the filter's &Category!=Slow part is dead on a draft since the Windows jobs run only in the full tier; it stays for a manual run
    # of a branch, and keeps the shards complementary. A PR that changes only
    # tools, benchmarks or docs the tests do not read skips the library tests; the job still starts, as the check names
    # are fixed, and runs the PowerShell regression of shard a when benchmarks/MeshRepairBenchmark changed.)
    steps:
      - uses: actions/checkout@v4
        if: needs.scope.outputs.library == 'true' || (matrix.shard == 'a' && needs.scope.outputs.ps1 == 'true')
      - uses: actions/setup-dotnet@v4
        if: needs.scope.outputs.library == 'true' || (matrix.shard == 'a' && needs.scope.outputs.ps1 == 'true')
        with:
          dotnet-version: 10.0.x
      # A net48 shard hung until the 60-minute timeout without a trx or a name (#824). --blame-hang kills the test host after 10 minutes
      # without a test finishing, names the running test in the log, writes the trx, Sequence_*.xml (the tests that started) and a mini
      # dump into test-results/, which the artifact step below uploads; the Blame summary step names the tests that did not complete.
      # No ProcDump is installed: vstest takes the dump of the .NET Framework test host by itself (probe on windows-latest, 2026-11-13).
      # No test of the suite runs near 10 minutes (CLAUDE.md: 5 s, 10 s with the Slow tag), so a healthy run is unchanged.
      - name: Test (net48 / netstandard2.0)
        if: needs.scope.outputs.library == 'true'
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net48 --blame --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini --filter "${{ matrix.filter }}&Category!=Nightly${{ env.FULL_TIER != 'true' && '&Category!=Slow' || '' }}" --logger "trx;LogFileName=net48-${{ matrix.shard }}.trx" --results-directory test-results
      - name: Test the Clipper2 package (net48 / netstandard2.0)
        if: needs.scope.outputs.library == 'true' && matrix.shard == 'a'
        run: dotnet test tests/geometry3Sharp.Clipper2.Tests -c Release -f net48 --blame --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini --logger "trx;LogFileName=clipper2-net48.trx" --results-directory test-results
      - name: Blame summary (the tests that did not complete)
        if: (failure() || cancelled()) && needs.scope.outputs.library == 'true'
        continue-on-error: true
        run: python tools/blame_summary.py test-results --summary $env:GITHUB_STEP_SUMMARY
      # A PR that changes only a benchmark script (ps1 without library) runs no net48 test build, which is what builds the netstandard2.0
      # library the two checks below read: build it here (a PR with a new thread_scaling.ps1 failed 'Build the netstandard2.0 library')
      - name: Build the netstandard2.0 library (ps1-only changes)
        if: matrix.shard == 'a' && needs.scope.outputs.library != 'true' && needs.scope.outputs.ps1 == 'true'
        run: dotnet build geometry3Sharp_netstandard.csproj -c Release -f netstandard2.0
      - name: Benchmark reporting regression (MeshRepairBenchmark)
        if: matrix.shard == 'a' && (needs.scope.outputs.library == 'true' || needs.scope.outputs.ps1 == 'true')
        shell: powershell
        run: benchmarks/MeshRepairBenchmark/test_validity_reporting.ps1
      # net48 / net10.0 benchmark comparison (benchmarks/net48-compare, #929): the build of the three benchmarks for both runtimes and a smoke run
      # of tiny procedural cases (no data, one round, no timing judged); it fails if a result hash differs between the runtimes.
      - name: net48 benchmark build and smoke run (Windows PowerShell)
        if: matrix.shard == 'a' && (needs.scope.outputs.library == 'true' || needs.scope.outputs.ps1 == 'true')
        shell: powershell
        run: benchmarks/net48-compare/run.ps1 -Smoke -OutDir smoke-results
      - name: net48 benchmark smoke run (PowerShell 7)
        if: matrix.shard == 'a' && (needs.scope.outputs.library == 'true' || needs.scope.outputs.ps1 == 'true')
        shell: pwsh
        run: benchmarks/net48-compare/run.ps1 -Smoke -NoBuild -OutDir smoke-results-pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-results
          path: test-results/

  # The tier rule of the golden-master policy (docs/design/DETERMINISM.md 6b; .github/workflows/tier-rule.yml for a manual run): a
  # documented operation of tier 1 may not gain a call path to the platform libm. A merge-gate check, so a job of the full stage
  # (about 2 minutes; it ran on library PRs only before, now on every full run, which keeps the gate free of path filters).
  tier-rule:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build geometry3Sharp_netstandard.csproj -c Release -f net10.0
      - run: dotnet build tools/DeterminismReach -c Release
      - name: Self-test and tier rule
        run: |
          R="dotnet tools/DeterminismReach/bin/Release/net10.0/DeterminismReach.dll"
          $R self-test
          $R tier bin/Release/net10.0/geometry3Sharp.dll --docs docs/OPERATIONS.md --docs docs/guides \
            --baseline tools/DeterminismReach/tier1.txt

  # The merge gate of a PR (owner 2026-11-23): the commit status `full-ci` on the PR's head. Branch protection requires it (for a
  # docs-only PR, which never runs this workflow, docs.yml posts it), not the job names: a skipped job counts as passed there, a pending status does not. Without the label
  # `full-ci` the status is pending ("label full-ci not set"), so a PR cannot merge on the quick stage alone; with it, it is green
  # only if the full matrix passed on this head (isolated and time-rule may be skipped, for a PR that does not change the library).
  # A later push gets no status until its own run ends, so an old green never covers a new head. (Fork PRs: the token cannot
  # write statuses; the step warns and the owner checks the jobs by hand.)
  full-ci-status:
    needs: [scope, linux, isolated, time-rule, netstandard, tier-rule]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha }}
      FULL: ${{ needs.scope.outputs.full }}
      LINUX: ${{ needs.linux.result }}
      NETSTANDARD: ${{ needs.netstandard.result }}
      ISOLATED: ${{ needs.isolated.result }}
      TIME_RULE: ${{ needs.time-rule.result }}
      TIER_RULE: ${{ needs.tier-rule.result }}
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post the status full-ci
        run: |
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          if [ "$FULL" != true ]; then
            state=pending; desc="label full-ci not set: the full matrix has not run on this head"
          elif [ "$LINUX" = success ] && [ "$NETSTANDARD" = success ] && [ "$TIER_RULE" = success ] && ok "$ISOLATED" && ok "$TIME_RULE"; then
            state=success; desc="full matrix passed on this head"
          else
            state=failure; desc="full matrix: linux $LINUX, netstandard $NETSTANDARD, tier-rule $TIER_RULE, isolated $ISOLATED, time-rule $TIME_RULE"
          fi
          echo "full-ci: $state ($desc)"
          printf '### Merge gate\n`full-ci`: **%s** (%s)\n' "$state" "$desc" >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$state" -f context=full-ci -f description="$desc" -f target_url="$URL" \
            || echo "::warning::the status full-ci could not be posted (a fork PR has a read-only token): check the full jobs by hand"
          [ "$state" != failure ]
