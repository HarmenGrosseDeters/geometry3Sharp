name: CI

# THROWAWAY probe branch (never merged): runs the new tests of #891 and #892 against the BASE library (master) on net48 and
# net10.0, to show which runtime the fixes act on.
on:
  workflow_dispatch:

jobs:
  net48-base:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: New tests on the base library, net48
        continue-on-error: true
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net48 --filter "FullyQualifiedName~GridIndexers_ToGrid_ExtremesHaveSpecifiedCells|FullyQualifiedName~Box3d_SignedZeroBounds_AreIndependentOfOrder" --logger "console;verbosity=normal"
      - name: New tests on the base library, net10.0
        continue-on-error: true
        run: dotnet test tests/geometry3Sharp.Tests -c Release -f net10.0 --filter "FullyQualifiedName~GridIndexers_ToGrid_ExtremesHaveSpecifiedCells|FullyQualifiedName~Box3d_SignedZeroBounds_AreIndependentOfOrder" --logger "console;verbosity=normal"
